name: Tests

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'hotfix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.4'
            laravel: '12.*'
            testbench: '^10.0'
          - php: '8.4'
            laravel: '13.*'
            testbench: '^11.0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_sqlite, sqlite3
          coverage: xdebug
          tools: composer:v2
        env:
          XDEBUG_MODE: coverage

      - name: Validate composer
        run: |
          composer validate --no-check-publish
          composer validate packages/core/composer.json --strict

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php${{ matrix.php }}-laravel${{ matrix.laravel }}-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php${{ matrix.php }}-laravel${{ matrix.laravel }}-
            ${{ runner.os }}-php${{ matrix.php }}-

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/pest --ci --coverage --min=80 --coverage-clover=coverage.xml
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          XDEBUG_MODE: coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # Postgres lane (master plan P4 #11). The default matrix above runs on in-memory
  # SQLite, where the CAS concurrency backbone is a no-op: pg_advisory_xact_lock,
  # FOR UPDATE, SERIALIZABLE and the gin(jsonb_path_ops) indexes only EXIST on a real
  # server. This job points the binary/concurrency-sensitive suites at Postgres so those
  # paths actually execute: the destructive orphan prune + lock-then-recheck tests
  # (BlobOrphanPruneTest) run here instead of skipping, the full default migration (incl.
  # the v_activity jsonb gin index) is exercised against pgsql, and the yjs_state bytea
  # round-trip (NUL-safe binary) is verified on a real bytea column.
  #
  # Each suite is its OWN pest STEP (Cas, then Document). A pest process migrates the
  # schema once (RefreshDatabase migrate:fresh at start), so one process hosts only ONE
  # TestCase schema; Cas uses the base TestCase, Document uses DocumentTestCase, hence two
  # steps. The remaining heterogeneous TestCases (Ulid/Spatie/TablePrefix) would each need
  # their own step too; bringing the WHOLE suite onto Postgres is a separate follow-up.
  test-pgsql:
    name: PHP 8.4 / Postgres (binary + advisory-lock lane)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vaulter
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: vaulter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vaulter -d vaulter_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.4 (with pdo_pgsql)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_pgsql, pgsql
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: |
          composer require "laravel/framework:12.*" "orchestra/testbench:^10.0" --dev --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      # Each suite runs as its OWN pest invocation: RefreshDatabase migrate:fresh's at
      # process start, so a per-step (= per-TestCase-schema) run is clean on the shared
      # database. Two TestCases in ONE invocation would NOT be (the schema is migrated
      # once per process) — that is the heterogeneous-suite limitation noted above.
      - name: Run the CAS suite on Postgres (advisory-xact-lock / FOR UPDATE / SERIALIZABLE / orphan prune)
        run: vendor/bin/pest --ci packages/core/tests/Cas
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: vaulter_test
          DB_USERNAME: vaulter
          DB_PASSWORD: secret

      - name: Run the Document suite on Postgres (yjs_state bytea NUL-safe round-trip)
        run: vendor/bin/pest --ci packages/core/tests/Document
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: vaulter_test
          DB_USERNAME: vaulter
          DB_PASSWORD: secret
