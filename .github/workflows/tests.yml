name: Tests

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'hotfix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.4'
            laravel: '12.*'
            testbench: '^10.0'
          - php: '8.4'
            laravel: '13.*'
            testbench: '^11.0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_sqlite, sqlite3
          coverage: xdebug
          tools: composer:v2
        env:
          XDEBUG_MODE: coverage

      - name: Validate composer
        run: |
          composer validate --no-check-publish
          composer validate packages/core/composer.json --strict

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-php${{ matrix.php }}-laravel${{ matrix.laravel }}-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-php${{ matrix.php }}-laravel${{ matrix.laravel }}-
            ${{ runner.os }}-php${{ matrix.php }}-

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/pest --ci --coverage --min=80 --coverage-clover=coverage.xml
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          XDEBUG_MODE: coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # Postgres lane (master plan P4 #11). The default matrix above runs on in-memory
  # SQLite, where the CAS concurrency backbone is a no-op: pg_advisory_xact_lock,
  # FOR UPDATE, SERIALIZABLE and the gin(jsonb_path_ops) indexes only EXIST on a real
  # server. This job points the binary/concurrency-sensitive suites at Postgres so those
  # paths actually execute: the destructive orphan prune + lock-then-recheck tests
  # (BlobOrphanPruneTest) run here instead of skipping, the full default migration (incl.
  # the v_activity jsonb gin index) is exercised against pgsql, and the yjs_state bytea
  # round-trip (NUL-safe binary) is verified on a real bytea column.
  #
  # Each TestCase schema is its OWN pest STEP. A pest process migrate:fresh's once at
  # start (RefreshDatabase), so one process can host only ONE TestCase schema; the suite
  # mixes heterogeneous TestCases (base, Document, Ulid, TablePrefix, the three id
  # strategies, …), so each gets a step that runs on the shared database after its own
  # migrate:fresh. The base step (TestCase) bundles all dirs that share that schema.
  #
  # Spatie is intentionally absent: its TestCase scaffolds users + the spatie tables via
  # direct DDL in defineDatabaseMigrations rather than registered migrations, which does
  # not survive a persistent connection's per-test transaction the way migrate:fresh does.
  # The spatie driver itself is DB-agnostic (it delegates to spatie/laravel-permission)
  # and stays covered on the SQLite matrix.
  test-pgsql:
    name: PHP 8.4 / Postgres (full schema portability lane)
    runs-on: ubuntu-latest

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: vaulter_test
      DB_USERNAME: vaulter
      DB_PASSWORD: secret

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vaulter
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: vaulter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vaulter -d vaulter_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.4 (with pdo_pgsql)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_pgsql, pgsql
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: |
          composer require "laravel/framework:12.*" "orchestra/testbench:^10.0" --dev --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      # One step per TestCase schema (each pest process migrate:fresh's its own schema on
      # the shared database). The DB_* coordinates come from the job-level env above.

      # base TestCase — HTTP surface, ACL, schema, CAS (advisory-xact-lock / FOR UPDATE /
      # SERIALIZABLE / orphan prune), webhooks, uploads, the v_activity jsonb gin index,
      # and the case-folded document search.
      - name: 'Postgres: base TestCase suite'
        run: >-
          vendor/bin/pest --ci
          packages/core/tests/Access
          packages/core/tests/Activity
          packages/core/tests/Cas
          packages/core/tests/Drive
          packages/core/tests/Feature
          packages/core/tests/Panels
          packages/core/tests/Schema
          packages/core/tests/Sharing
          packages/core/tests/Uploads
          packages/core/tests/Webhooks

      # DocumentTestCase — yjs_state bytea NUL-safe round-trip + the document-node path.
      - name: 'Postgres: Document suite'
        run: vendor/bin/pest --ci packages/core/tests/Document

      # The id-strategy schemas — each proves the self-referencing v_nodes.parent_id FK
      # migrates (the PK must be declared before the FK; see UlidIds/Uuid7Ids::key).
      - name: 'Postgres: ULID suite'
        run: vendor/bin/pest --ci packages/core/tests/Ulid

      - name: 'Postgres: id-strategy (bigint) suite'
        run: >-
          vendor/bin/pest --ci
          packages/core/tests/IdStrategy/IdStrategyTest.php
          packages/core/tests/IdStrategy/IdStrategyResolverTest.php
          packages/core/tests/IdStrategy/Bigint

      - name: 'Postgres: id-strategy (ULID) suite'
        run: vendor/bin/pest --ci packages/core/tests/IdStrategy/Ulid

      - name: 'Postgres: id-strategy (UUIDv7) suite'
        run: vendor/bin/pest --ci packages/core/tests/IdStrategy/Uuid7

      - name: 'Postgres: table-prefix suite'
        run: vendor/bin/pest --ci packages/core/tests/TablePrefix

      - name: 'Postgres: activity-disabled suite'
        run: vendor/bin/pest --ci packages/core/tests/ActivityGate
