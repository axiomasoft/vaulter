name: Monorepo split (PHP)

# Mirrors Filament's release mechanics: on every pushed tag, each PHP package under
# packages/<name> is force-split into its own read-only repo axioma-studio/vaulter-<name>,
# and the same tag is propagated (as_tag) so Packagist — which is registered against
# the SPLIT repos — picks up the new version. The npm packages are released separately
# by release-npm.yml.
#
# PREREQUISITES (one-time, NOT done here):
#   1. Create the empty target repos: axioma-studio/vaulter (metapackage), axioma-studio/vaulter-core,
#      axioma-studio/vaulter-media, axioma-studio/vaulter-drive, axioma-studio/vaulter-documents,
#      axioma-studio/vaulter-webhooks, axioma-studio/vaulter-collaboration, axioma-studio/vaulter-filament, axioma-studio/vaulter-azgard.
#   2. Add a repo/org secret GH_ACCESS_TOKEN — a PAT with `repo` scope that can push to
#      those split repos.
#   3. Register the SPLIT repos on Packagist (not this monorepo). Note: vaulter-azgard
#      hard-depends on axioma-studio/azguard-core (^0.2), so keep that package resolvable on
#      Packagist before registering the bridge (its local path-repositories are dev-only and
#      Composer ignores a dependency's own `repositories`, so consumers are unaffected).
#   4. VLT-CANON P2.1 renamed the bridge (permissions-azgard → azgard). If the old target repo
#      axioma-studio/vaulter-permissions-azgard was already created (or registered on Packagist)
#      under the pre-rename prerequisites, delete/abandon it — this workflow will never push to
#      it again, and an abandoned empty package under the old name would outrank nothing but
#      confuse everyone.
#
# The matrix is computed by scripts/release/route-release.php from release/packages.json (check-versions.php proves the
# workflow consumes it). vaulter-azgard is skipped while its AzGuard require is a dev constraint, and the
# verify-tags job then proves every other split repo carries the tag on the commit just pushed.
#
# Release handshake (PLAN3 P1.6): a tag first runs the full qualification (weekly-full.yml as a reusable workflow)
# on the exact tagged commit; only after it is green does verify-release-sha check that `CI gate` of ci.yml passed
# on that same SHA, and only after that does anything get split. Nothing waits for or looks up a "latest green run".
# Until the repos + secret exist this workflow will fail, so it is authored but dormant.
on:
  push:
    tags:
      - 'v*'
      - 'collaboration-v*'

permissions:
  contents: read

jobs:
  # Full qualification of the exact tagged commit (github.sha of this run): SQLite on both Laravel lines, pgsql and
  # mysql, pcov coverage, the stand, Node and the repository harness. A failure here stops the release.
  qualification:
    name: Full qualification
    uses: ./.github/workflows/weekly-full.yml
    permissions:
      contents: read

  verify-release-sha:
    name: Verify release SHA
    needs: qualification
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      checks: read
    steps:
      - name: Require the CI gate on the tagged commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          # `CI gate` (ci.yml) needs every lane of the pull-request CI, so one check stands for all of them.
          required_checks=(
            'CI gate'
          )

          comparison="$(gh api "/repos/${REPOSITORY}/compare/${RELEASE_SHA}...main" --jq '.status')"
          if [[ "${comparison}" != 'ahead' && "${comparison}" != 'identical' ]]; then
            echo "Tagged commit is not on main: ${RELEASE_SHA} (${comparison})" >&2
            exit 1
          fi

          failed=0
          for name in "${required_checks[@]}"; do
            result="$(gh api --method GET "/repos/${REPOSITORY}/commits/${RELEASE_SHA}/check-runs" \
              -f "check_name=${name}" \
              --jq '.check_runs | sort_by(.started_at) | last | [.status, (.conclusion // "")] | @tsv')"

            if [[ "${result}" != $'completed\tsuccess' ]]; then
              echo "Required check is missing or not successful: ${name}" >&2
              failed=1
            fi
          done

          exit "${failed}"

  # Routing + D18 qualification happen HERE, in a job that holds no publisher credential: the tag selects exactly one
  # release line, the evidence of this very SHA must carry the exact artifact identity of every routed package, and a
  # private split repository must be probed private through the API (an API error refuses). Only then does split run.
  # The artifact `release-qualification` is delivered by the canonical producers (PLAN4 P7.2-P7.5/P8.2); until it exists
  # this job fails and nothing is split - there is no SHA-only fallback.
  route:
    name: Route and qualify the tag
    needs: verify-release-sha
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      qualified: ${{ steps.route.outputs.qualified }}
      channel: ${{ steps.route.outputs.channel }}
      matrix: ${{ steps.route.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the qualification evidence of this SHA
        uses: actions/download-artifact@v4
        with:
          name: release-qualification
          path: release-evidence

      - name: Probe the visibility of the private split repositories
        env:
          GH_TOKEN: ${{ secrets.RELEASE_VISIBILITY_TOKEN }}
        run: |
          # Read-only metadata probe; an API failure leaves the destination out and the route refuses it.
          echo '{}' > release-evidence/visibility.json
          while IFS= read -r split; do
            state="$(gh api "/repos/${split}" --jq 'if .private then "private" else "public" end')" || continue
            jq --arg k "${split}" --arg v "${state}" '.[$k] = $v' release-evidence/visibility.json > visibility.next && mv visibility.next release-evidence/visibility.json
          done < <(jq -r '.php[] | select(.channel == "private") | .split' release/packages.json)

      - name: Route the tag and require the qualification
        id: route
        run: |
          php scripts/release/route-release.php --tag="${GITHUB_REF_NAME}" --sha="${GITHUB_SHA}" \
            --evidence-dir=release-evidence --github-output="${GITHUB_OUTPUT}"

  split:
    name: Split packages/${{ matrix.package }}
    needs: route
    if: needs.route.outputs.qualified == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.route.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The repository name comes from release/packages.json: the metapackage is axioma-studio/vaulter,
      # not axioma-studio/vaulter-vaulter. A manifest or probe error fails the job instead of shipping.
      - name: Resolve the split repository of packages/${{ matrix.package }}
        id: plan
        run: |
          split="$(jq -er --arg p 'packages/${{ matrix.package }}' '.php[] | select(.path == $p) | .split' release/packages.json)"
          echo "channel=${{ needs.route.outputs.channel }}" >> "$GITHUB_OUTPUT"
          echo "split=${split}" >> "$GITHUB_OUTPUT"
          echo "name=${split#axioma-studio/}" >> "$GITHUB_OUTPUT"
          echo "excluded=false" >> "$GITHUB_OUTPUT"

      # F-P2.1-06 (VLT-REMED P4.7): the subtree split below copies ONLY
      # packages/<name>, so a split repo (what Packagist is registered against, D15/
      # ADR-0010) never carried the root CHANGELOG.md — a consumer running
      # `composer require axioma-studio/vaulter-<name>` got a package with zero
      # changelog history. Copy the root CHANGELOG.md into the package directory
      # BEFORE the split step so it becomes part of the split commit/subtree.
      - name: Copy root CHANGELOG.md into packages/${{ matrix.package }} (F-P2.1-06)
        if: steps.plan.outputs.excluded != 'true' && steps.plan.outputs.channel == 'public'
        run: cp CHANGELOG.md packages/${{ matrix.package }}/CHANGELOG.md

      - name: Split packages/${{ matrix.package }} → ${{ steps.plan.outputs.split }}
        if: steps.plan.outputs.excluded != 'true'
        # Pinned by commit for supply-chain safety; the trailing comment is the version tag.
        uses: danharrin/monorepo-split-github-action@14e42e2437f674b8987c1f50ca3689116aea1893 # v2.4.5
        with:
          package_directory: packages/${{ matrix.package }}
          repository_organization: axioma-studio
          repository_name: ${{ steps.plan.outputs.name }}
          user_name: Axioma Bot
          user_email: dev@axioma.studio
          branch: main
          # Propagate the pushed tag to the split repo (used internally as as_tag).
          tag: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}

      # The subtree action does not report the commit it pushed, so read it back from the split
      # repo; verify-tags compares the tag against it.
      - name: Record the pushed split commit
        if: steps.plan.outputs.excluded != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
          SPLIT: ${{ steps.plan.outputs.split }}
        run: |
          mkdir -p expected-splits
          sha="$(git ls-remote "https://x-access-token:${GITHUB_TOKEN}@github.com/${SPLIT}.git" refs/heads/main | cut -f1)"
          if [[ -z "${sha}" ]]; then
            echo "split repo ${SPLIT} has no main branch" >&2
            exit 1
          fi
          jq -n --arg k "${SPLIT}" --arg v "${sha}" '{($k): $v}' \
            > "expected-splits/${{ matrix.package }}.json"

      - name: Upload expected split commit
        if: steps.plan.outputs.excluded != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: expected-split-${{ matrix.package }}
          path: expected-splits/${{ matrix.package }}.json

  verify-tags:
    name: Verify split tags
    needs: split
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download expected split commits
        uses: actions/download-artifact@v4
        with:
          pattern: expected-split-*
          path: expected-splits
          merge-multiple: true

      - name: Every split repository of the routed line carries the tag on the pushed commit
        env:
          TAG: ${{ github.ref_name }}
        run: |
          jq -s 'add' expected-splits/*.json > expected-splits.json
          scripts/release/verify-split-tags.sh "${TAG}" expected-splits.json
