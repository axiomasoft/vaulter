name: Frontend

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'hotfix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  vue:
    name: "@vaulter/vue (Node ${{ matrix.node }})"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm install

      # The committed API types must be exactly what openapi/vaulter-v1.yaml generates.
      - name: Generated API types are current
        run: npm run api:check --workspace @vaulter/vue

      - name: Type-check
        run: npm run typecheck --workspace @vaulter/vue

      - name: Test
        run: npm run test --workspace @vaulter/vue

      - name: Build
        run: npm run build --workspace @vaulter/vue

  hocuspocus:
    name: "@vaulter/hocuspocus-server (Node ${{ matrix.node }})"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # @hocuspocus/server@4 declares engines.node >=22 (Hocuspocus 4 requires
        # Node 22+). Node 20 was dropped in P4.1 — `npm ci` fails it under engine-strict
        # and a Node-20 lane would "test" a config the direct dependency no longer supports.
        node: ['22']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        working-directory: ./hocuspocus-server
        run: npm ci

      # Syntax gate: every source module parses (mirrors the `check` script).
      - name: Syntax check
        working-directory: ./hocuspocus-server
        run: npm run check

      # Behaviour gate: the node:test suite — incl. websocket-hardening.test.js —
      # runs on every PR/push so the collab-hub security invariants (frame cap,
      # Throttle armed, JWT/webhook/Origin/expiry seams) cannot silently regress.
      - name: Test
        working-directory: ./hocuspocus-server
        run: npm test
