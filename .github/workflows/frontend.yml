name: Frontend

on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'hotfix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  vue:
    name: "@docvault/vue (Node ${{ matrix.node }})"
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm install

      - name: Type-check
        run: npm run typecheck --workspace @docvault/vue

      - name: Test
        run: npm run test --workspace @docvault/vue

      - name: Build
        run: npm run build --workspace @docvault/vue
