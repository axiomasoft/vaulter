name: Documents

# The vaulter-documents package (document-node behaviour: format handlers, collab,
# export, over the vaulter-core kernel) is tested in isolation: its own gate (Pint +
# PHPStan max + Pest + 100% type-coverage) on the fast SQLite lane, plus a dedicated
# Postgres lane that exercises the yjs_state bytea NUL-safe round-trip and the
# v_node_document_versions jsonb gin(jsonb_path_ops) index — both SKIP on SQLite. It
# requires vaulter-core (path-repo) and, for its OWN test fixtures only, vaulter-drive
# + vaulter-media (require-dev — documents's production `require` stays core-only, T6),
# so a change to any of the three retriggers it.
on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'hotfix/**']
    paths:
      - 'packages/documents/**'
      - 'packages/core/**'
      - 'packages/drive/**'
      - 'packages/media/**'
      - '.github/workflows/documents.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  documents:
    # F-P4.4-02: a bare `composer install` here used to resolve exactly ONE Laravel
    # version (the constraint's upper bound) — the L12 lane never actually ran. The
    # matrix mirrors tests.yml: an explicit `composer require` per cell forces BOTH
    # declared Laravel/Testbench combinations to install and run.
    name: vaulter-documents (SQLite lane, Laravel ${{ matrix.laravel }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - laravel: '12.*'
            testbench: '^10.0'
          - laravel: '13.*'
            testbench: '^11.0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        working-directory: packages/documents
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Code style (Pint)
        working-directory: packages/documents
        run: vendor/bin/pint --test

      - name: Static analysis (PHPStan max)
        working-directory: packages/documents
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M

      - name: Tests (Pest)
        working-directory: packages/documents
        run: vendor/bin/pest --ci

      - name: Type coverage (100%)
        working-directory: packages/documents
        run: vendor/bin/pest --type-coverage --min=100

  documents-pgsql:
    name: vaulter-documents (Postgres yjs/gin lane)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: vaulter_test
      DB_USERNAME: vaulter
      DB_PASSWORD: secret

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vaulter
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: vaulter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vaulter -d vaulter_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.4 (with pdo_pgsql)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_pgsql, pgsql, pcntl, posix
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        working-directory: packages/documents
        run: composer install --prefer-dist --no-interaction --no-progress

      # The document suite on real Postgres: the DB_* coordinates come from the
      # job-level env above, so the yjs_state bytea NUL-safe round-trip and the
      # v_node_document_versions jsonb gin(jsonb_path_ops) index (SKIP on SQLite) now
      # EXECUTE.
      - name: 'Postgres: document suite'
        working-directory: packages/documents
        run: vendor/bin/pest --ci tests/Document tests/Schema
