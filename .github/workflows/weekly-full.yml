name: Weekly full

# Full qualification: everything ci.yml thins out per change, once and complete — every package on
# Laravel 13 with `--full` (fast + serial + extended, each exactly once), every package on pgsql and
# mysql, pcov coverage with its floor, the stand (real processes + the functional load tests), Node and the
# repository harness. It never benchmarks (load.yml).
#
# Triggers: Monday 04:00 UTC, by hand, and as a reusable workflow. monorepo-split.yml calls it for a release tag,
# so the exact tagged commit (github.sha of the caller) is qualified first and nothing is published before
# `Full qualification gate` is green — there is no "latest green run" lookup.
on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
  workflow_call:

concurrency:
  group: weekly-full-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  # The actual PHP support, checked against composer.json/groups.php by scripts/ci/workflow-policy.py.
  PHP_SUPPORT: '{"core":{"dir":".","lines":["13"],"database":true,"serial":true,"types":true,"rector":true,"azguard":false},"integration":{"dir":".","lines":["13"],"database":true,"serial":true,"types":true,"rector":true,"azguard":false},"media":{"dir":"packages/media","lines":["13"],"database":true,"serial":true,"types":true,"rector":false,"azguard":false},"drive":{"dir":"packages/drive","lines":["13"],"database":true,"serial":true,"types":true,"rector":false,"azguard":false},"documents":{"dir":"packages/documents","lines":["13"],"database":true,"serial":true,"types":true,"rector":false,"azguard":false},"webhooks":{"dir":"packages/webhooks","lines":["13"],"database":true,"serial":true,"types":true,"rector":false,"azguard":false},"azguard":{"dir":"packages/azguard","lines":["13"],"database":true,"serial":false,"types":false,"rector":false,"azguard":true},"filament":{"dir":"packages/filament","lines":["13"],"database":false,"serial":false,"types":true,"rector":true,"azguard":false}}'

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      fast_matrix: ${{ steps.plan.outputs.fast_matrix }}
      db_matrix: ${{ steps.plan.outputs.db_matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Every lane, every package
        id: plan
        run: python3 scripts/ci/workflow-policy.py plan --mode all --php 8.4,8.5,8.6 >> "$GITHUB_OUTPUT"

  full:
    name: Full / ${{ matrix.package }} / Laravel ${{ matrix.laravel }} / PHP ${{ matrix.php }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    continue-on-error: ${{ matrix.php == '8.6' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.fast_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false


      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_sqlite, sqlite3, pcntl, posix
          coverage: none
          tools: composer:v2

      - name: Prepare pinned Composer workspace repositories
        run: scripts/ci/checkout-ecosystem.sh

      - name: Install dependencies (Laravel ${{ matrix.laravel }})
        env:
          LARAVEL: ${{ matrix.laravel }}
          TESTBENCH: ${{ matrix.testbench }}
          COMPOSER_IGNORE_PHP: ${{ matrix.php == '8.6' && '--ignore-platform-req=php' || '' }}
        run: |
          composer require "laravel/framework:$LARAVEL" "orchestra/testbench:$TESTBENCH" --dev --no-interaction --no-update
          composer update ${COMPOSER_IGNORE_PHP:+"$COMPOSER_IGNORE_PHP"} --prefer-dist --no-interaction --no-progress

      - name: Verify the installed versions
        env:
          LARAVEL: ${{ matrix.laravel }}
          TESTBENCH: ${{ matrix.testbench }}
        run: |
          set -euo pipefail
          installed_laravel="$(composer show laravel/framework --format=json | jq -r '.versions[0]')"
          installed_testbench="$(composer show orchestra/testbench --format=json | jq -r '.versions[0]')"
          echo "laravel/framework $installed_laravel, orchestra/testbench $installed_testbench"
          installed_laravel="${installed_laravel#v}"
          installed_testbench="${installed_testbench#v}"
          expected_testbench="${TESTBENCH#^}"
          if [[ "${installed_laravel%%.*}" != "${LARAVEL%%.*}" ]]; then
            echo "::error::expected Laravel ${LARAVEL}, installed ${installed_laravel}"
            exit 1
          fi
          if [[ "${installed_testbench%%.*}" != "${expected_testbench%%.*}" ]]; then
            echo "::error::expected Testbench ${TESTBENCH}, installed ${installed_testbench}"
            exit 1
          fi

      # Parallel pass without nofull,serial, then the serial group once; the extended cases run in the first pass.
      - name: Tests (SQLite, full)
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          PHP84_BIN="$(command -v php)"
          export PHP84_BIN
          scripts/t sqlite -p "$PACKAGE" --full -j 4

      - name: Type coverage (100%)
        if: matrix.types
        working-directory: ${{ matrix.dir }}
        run: |
          if [[ ! -e vendor ]]; then ln -s "$GITHUB_WORKSPACE/vendor" vendor; fi
          "$GITHUB_WORKSPACE/vendor/bin/pest" --type-coverage --min=100

  engines:
    name: Full / ${{ matrix.engine }} / ${{ matrix.package }} / PHP ${{ matrix.php }}
    needs: plan
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    continue-on-error: ${{ matrix.php == '8.6' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.db_matrix) }}
    env:
      DB_EXTERNAL: '1'
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.port }}
      DB_DATABASE: vaulter_test
      DB_USERNAME: ${{ matrix.username }}
      DB_PASSWORD: secret
    # One service: a Postgres cell does not wait for MySQL to become healthy, and the reverse.
    # PostgreSQL 18 stores data under /var/lib/postgresql (not .../data). Both images are digest-pinned.
    services:
      db:
        image: ${{ (matrix.version == '18.7' && 'postgres:18.7-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71') || (matrix.version == '19.0' && 'postgres:19.0-alpine@sha256:8b0ff4cdf221f0c53d7fcda681d3b461be725c492cd881c5ec9c0ad25023f188') || 'mysql:9.7@sha256:df90258da46f6e7ff8574ff84f17618aba0765cac749928299c69fd4e7cb8ad8' }}
        env:
          POSTGRES_USER: ${{ matrix.username }}
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: vaulter_test
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: vaulter_test
        ports:
          - ${{ matrix.port }}:${{ matrix.engine == 'pgsql' && '5432' || '3306' }}
        options: ${{ matrix.engine == 'pgsql' && '--tmpfs /var/lib/postgresql --health-cmd "pg_isready -U vaulter -d vaulter_test" --health-interval 5s --health-timeout 5s --health-retries 10' || '--tmpfs /var/lib/mysql --health-cmd "mysqladmin ping -h 127.0.0.1 -psecret" --health-interval 5s --health-timeout 5s --health-retries 20' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false


      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_pgsql, pgsql, pdo_mysql, pdo_sqlite, sqlite3, pcntl, posix
          coverage: none
          tools: composer:v2

      - name: Prepare pinned Composer workspace repositories
        run: scripts/ci/checkout-ecosystem.sh

      - name: Install dependencies
        env:
          COMPOSER_IGNORE_PHP: ${{ matrix.php == '8.6' && '--ignore-platform-req=php' || '' }}
        run: composer install ${COMPOSER_IGNORE_PHP:+"$COMPOSER_IGNORE_PHP"} --prefer-dist --no-interaction --no-progress

      - name: Tests (${{ matrix.engine }}, full)
        env:
          ENGINE: ${{ matrix.engine }}
          PACKAGE: ${{ matrix.package }}
        run: |
          PHP84_BIN="$(command -v php)"
          export PHP84_BIN
          scripts/t "$ENGINE" -p "$PACKAGE" --full -j 4

  coverage:
    name: Coverage (pcov) / PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    continue-on-error: ${{ matrix.php == '8.6' }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5', '8.6']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP ${{ matrix.php }} (pcov)
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_sqlite, sqlite3, pcntl, posix
          coverage: pcov
          tools: composer:v2

      - name: Prepare pinned Composer workspace repositories
        run: scripts/ci/checkout-ecosystem.sh

      - name: Install dependencies
        env:
          COMPOSER_IGNORE_PHP: ${{ matrix.php == '8.6' && '--ignore-platform-req=php' || '' }}
        run: composer install ${COMPOSER_IGNORE_PHP:+"$COMPOSER_IGNORE_PHP"} --prefer-dist --no-interaction --no-progress

      # The coverage floor of core (80%); coverage is not a PR lane.
      - name: Core coverage
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
        run: vendor/bin/pest --ci --coverage --min=80

  stand:
    name: Stand (real processes, functional load tests) / PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    continue-on-error: ${{ matrix.php == '8.6' }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5', '8.6']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_sqlite, sqlite3, pcntl, posix
          coverage: none
          tools: composer:v2

      - name: Prepare pinned Composer workspace repositories
        run: scripts/ci/checkout-ecosystem.sh

      - name: Install dependencies
        env:
          COMPOSER_IGNORE_PHP: ${{ matrix.php == '8.6' && '--ignore-platform-req=php' || '' }}
        run: composer install ${COMPOSER_IGNORE_PHP:+"$COMPOSER_IGNORE_PHP"} --prefer-dist --no-interaction --no-progress

      # Fail if the stand suite skips a test.
      - name: Stand
        run: |
          PHP84_BIN="$(command -v php)"
          export PHP84_BIN
          scripts/t stand --no-skips

  vue:
    name: "@vaulter/vue (Node ${{ matrix.node }})"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ['26.13.1']  # only the current Node line is supported (engines.node >=26.13.1)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm ci

      - name: Generated API types are current
        run: npm run api:check --workspace @vaulter/vue

      - name: Type-check
        run: npm run typecheck --workspace @vaulter/vue

      - name: Test
        run: npm run test --workspace @vaulter/vue

      - name: Build
        run: npm run build --workspace @vaulter/vue

      - name: Check @vaulter/vue bundle size budget
        run: npm run budget:check --workspace @vaulter/vue

  e2e-documents:
    name: "E2E documents-basic (${{ matrix.engine }})"
    needs: vue
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        engine: ['sqlite', 'pgsql']
    env:
      CI: 'true'
      E2E_DB_CONNECTION: ${{ matrix.engine }}
      DB_CONNECTION: ${{ matrix.engine }}
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: vaulter_e2e
      DB_USERNAME: vaulter
      DB_PASSWORD: secret
    services:
      postgres:
        image: postgres:18.7-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
        env:
          POSTGRES_USER: vaulter
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: vaulter_e2e
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql
          --health-cmd "pg_isready -U vaulter -d vaulter_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_pgsql, pgsql, pdo_sqlite, sqlite3, zip
          coverage: none
          tools: composer:v2

      - name: Prepare pinned Composer workspace repositories
        run: scripts/ci/checkout-ecosystem.sh

      - name: Setup Node.js 26.13.1
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.1'

      - name: Smoke test the Node runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libatomic1 libstdc++6
          node -e "process.exit(0)"

      - name: Run documents-basic consumer E2E (${{ matrix.engine }})
        run: |
          PACKMAN_REF="$(git -C ../packman rev-parse --verify 'HEAD^{commit}')"
          export PACKMAN_REF
          bash e2e/consumers/documents-basic/run.sh

  repo:
    name: Repo harness, workflow policy, actionlint / PHP ${{ matrix.php }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    continue-on-error: ${{ matrix.php == '8.6' }}
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5', '8.6']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_sqlite, sqlite3, pcntl, posix
          coverage: none
          tools: composer:v2

      - name: Prepare pinned Composer workspace repositories
        run: scripts/ci/checkout-ecosystem.sh

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install dependencies
        env:
          COMPOSER_IGNORE_PHP: ${{ matrix.php == '8.6' && '--ignore-platform-req=php' || '' }}
        run: composer install ${COMPOSER_IGNORE_PHP:+"$COMPOSER_IGNORE_PHP"} --prefer-dist --no-interaction --no-progress

      - name: Workflow policy
        run: |
          python3 -m pip install 'pyyaml==6.0.2'
          python3 scripts/ci/workflow-policy.py
          python3 -m unittest discover -s tests/Repo -p WorkflowPolicyTest.py

      - name: Repo harness tests
        run: |
          PHP84_BIN="$(command -v php)"
          export PHP84_BIN
          scripts/t sqlite -p repo --full

      - name: actionlint
        if: matrix.php == '8.4'
        run: docker run --rm -v "$PWD":/repo -w /repo rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9

  full-gate:
    name: Full qualification gate
    if: always()
    needs: [plan, full, engines, coverage, stand, vue, e2e-documents, repo]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Every lane is required: a failed, cancelled or skipped one (a stand that did not run included) is red.
      - name: Verdict and qualification receipt
        env:
          NEEDS: ${{ toJSON(needs) }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_WORKFLOW: ${{ github.workflow }}
        run: |
          set -euo pipefail
          bad="$(jq -r 'to_entries[] | select(.value.result != "success") | "\(.key): \(.value.result)"' <<<"$NEEDS")"
          if [[ -n "$bad" ]]; then
            echo "$bad" >&2
            exit 1
          fi
          mkdir -p release-evidence
          jq -n \
            --arg sha "${GITHUB_SHA}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg run_attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg workflow "${GITHUB_WORKFLOW}" \
            --argjson needs "${NEEDS}" \
            '{schema: "vaulter.release-qualification/v1", source_sha: $sha, workflow: ".github/workflows/weekly-full.yml", workflow_name: $workflow, run_id: $run_id, run_attempt: $run_attempt, ci_gate: {sha: $sha, conclusion: "success"}, jobs: ($needs | with_entries(.value = .value.result))}' \
            > release-evidence/qualification.json
          echo 'full qualification OK'

      - name: Upload release qualification evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-qualification
          path: release-evidence
          if-no-files-found: error
          retention-days: 90
