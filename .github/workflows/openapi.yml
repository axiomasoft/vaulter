name: OpenAPI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  breaking:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BC_HOST_BOOTSTRAP: ${{ vars.BC_HOST_BOOTSTRAP }}
      BC_HOST_PYTHON: ${{ vars.BC_HOST_PYTHON }}
      BC_TOOL_ROOT: ${{ vars.BC_TOOL_ROOT }}
      BC_TOOL_REV: ${{ vars.BC_TOOL_REV }}
      BC_SHA256SUMS: ${{ vars.BC_SHA256SUMS }}
      BC_RUNTIME_APPROVAL: ${{ vars.BC_RUNTIME_APPROVAL }}
      BC_RUNTIME_APPROVAL_SHA256: ${{ vars.BC_RUNTIME_APPROVAL_SHA256 }}
      BC_SOURCE_ROOT: ${{ github.workspace }}
      BC_SOURCE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Shared trusted checker and pinned oasdiff wrapper
        working-directory: /tmp
        run: |
          test "${BC_HOST_BOOTSTRAP:0:1}" = /
          test "${BC_HOST_PYTHON:0:1}" = /
          exec "$BC_HOST_PYTHON" -I "$BC_HOST_BOOTSTRAP"
