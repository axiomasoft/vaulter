name: Mutation Testing

# D3/D4 (PLAN3 P1.2): mutation testing runs ONLY from this workflow, ONLY by hand
# (workflow_dispatch) and for ONE package per run. No other workflow carries a
# `--mutate` step. The --min floors and commands below are moved verbatim from the
# former per-package jobs and are unchanged. Parallel `pest --mutate` is forbidden
# (see the R02 / VLT-MUT D2 notes on each job).
on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to mutate'
        type: choice
        options: [core, media, drive, documents, filament]
        default: core

jobs:
  core:
    if: inputs.package == 'core'
    name: Mutation core (${{ matrix.database-name }})
    runs-on: ubuntu-latest
    timeout-minutes: 360

    strategy:
      fail-fast: false
      matrix:
        include:
          - database-name: SQLite
            connection: sqlite
            database: ':memory:'
          - database-name: PostgreSQL
            connection: pgsql
            database: vaulter_core_test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vaulter_core_test
          POSTGRES_USER: vaulter
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U vaulter -d vaulter_core_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pcntl, pdo, pdo_pgsql, pgsql, pdo_sqlite, posix, sqlite3
          coverage: xdebug
          tools: composer:v2
        env:
          XDEBUG_MODE: coverage

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-mutation-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-mutation-
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      # R02 proved that pest-plugin-mutate v4.0.1 plus --parallel reports a false
      # 100%. Keep both driver lanes sequential and cold. Core's release verdict
      # is the PG+SQLite mutation-ID union. Until an ID-merging CI gate exists,
      # require 95 in each isolated lane; passing both is stricter and implies a
      # union >=95. It does not establish the current-source score: R16's cold
      # union measurement is still pending, and the existing floor is not lowered.
      - name: Mutation testing
        run: vendor/bin/pest --mutate --path=packages/core/src --covered-only --clear-cache --min=95
        env:
          APP_ENV: testing
          DB_CONNECTION: ${{ matrix.connection }}
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: ${{ matrix.database }}
          DB_USERNAME: vaulter
          DB_PASSWORD: secret
          XDEBUG_MODE: coverage

  # media has driver-conditional tests in BOTH directions (VLT-MUT D6), so neither
  # driver alone covers the package: TWO cold sequential runs and one ID-union gate.
  # NO `--parallel` (VLT-MUT D2): Pest hands each mutant subprocess the parent's argv,
  # `--parallel` included, the child re-enters ParaTest, dies on --mutate/--path without
  # running a test, and a non-zero child is how Pest recognises a KILLED mutant — every
  # mutant was "killed". Proof: plans/VLT-MUT/findings/P0.1-parallel-defect.md.
  # The final score merges Pest cache results by mutation ID: killed by either required
  # driver means killed in the union.
  media:
    if: inputs.package == 'media'
    name: Mutation media (PostgreSQL + SQLite union gate)
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      DB_DATABASE: vaulter_test
      DB_USERNAME: vaulter
      DB_PASSWORD: secret

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vaulter
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: vaulter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vaulter -d vaulter_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.4 (with coverage driver)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_sqlite, sqlite3, pdo_pgsql, pgsql
          coverage: xdebug
          tools: composer:v2
        env:
          XDEBUG_MODE: coverage

      - name: Install dependencies
        working-directory: packages/media
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: 'Mutation testing: Postgres'
        working-directory: packages/media
        run: |
          vendor/bin/pest --mutate --path=src --covered-only --clear-cache --min=0
          cp -a vendor/pestphp/pest-plugin-mutate/.temp/pest-mutate-cache "$RUNNER_TEMP/media-mutate-pgsql"
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          XDEBUG_MODE: coverage

      - name: 'Mutation testing: SQLite'
        working-directory: packages/media
        run: |
          vendor/bin/pest --mutate --path=src --covered-only --clear-cache --min=0
          cp -a vendor/pestphp/pest-plugin-mutate/.temp/pest-mutate-cache "$RUNNER_TEMP/media-mutate-sqlite"
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          XDEBUG_MODE: coverage

      - name: 'Mutation gate: PostgreSQL + SQLite ID union (95%)'
        working-directory: packages/media
        run: >-
          php bin/assert-mutation-union.php
          "$RUNNER_TEMP/media-mutate-pgsql"
          "$RUNNER_TEMP/media-mutate-sqlite"
          95

  # NO `--parallel` (VLT-MUT D2) — see the media job. Sequential is slow (~90 min) and
  # correct. The lane runs on POSTGRES, not SQLite: `--covered-only` mutates only what the
  # suite covers, and five tests (the four tests/Concurrency race guards and the FK-cascade
  # case in tests/Feature/PurgeTrashTest) self-skip on SQLite.
  drive:
    if: inputs.package == 'drive'
    name: Mutation drive (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: vaulter_test
      DB_USERNAME: vaulter
      DB_PASSWORD: secret

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vaulter
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: vaulter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vaulter -d vaulter_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.4 (with coverage driver)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_pgsql, pgsql, pcntl, posix
          coverage: xdebug
          tools: composer:v2
        env:
          XDEBUG_MODE: coverage

      - name: Install dependencies
        working-directory: packages/drive
        run: composer install --prefer-dist --no-interaction --no-progress

      # --min — ratchet ВВЕРХ (VLT-MUT D4 / дисциплина D35): цель 95, порог поднимается каждой
      # фазой и НИКОГДА не опускается. Текущее значение = floor(Score) − 5 по ЧЕСТНОМУ замеру
      # 2026-07-13 (последовательная мутация, pcov/PHP 8.4, Postgres 16, холодный кэш мутаций):
      # Score 48.34 % — 722 убито, 780 выжило, 8 таймаутов из 1510 мутантов. Прежние «100.00 %,
      # 1569 мутантов» были артефактом `--parallel`, а не измерением.
      #
      # 43 — не «планка качества», а страховка от регресса, пока P2 плана VLT-MUT добивает 780
      # выживших тестами. Опускать нельзя; поднимать — по каждому перемеру на холодном кэше.
      - name: Mutation testing
        working-directory: packages/drive
        run: vendor/bin/pest --mutate --path=src --covered-only --min=43
        env:
          XDEBUG_MODE: coverage

  # documents carries the XSS allow-list/decay barrier (VLT-CANON Open risk #4 / ADR-0018),
  # so `--min` is set and Pest exits non-zero when Score drops below the floor.
  documents:
    if: inputs.package == 'documents'
    name: Mutation documents (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      APP_ENV: testing
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: vaulter_documents_test
      DB_USERNAME: vaulter
      DB_PASSWORD: secret

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vaulter
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: vaulter_documents_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U vaulter -d vaulter_documents_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.4 (with coverage driver)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_pgsql, pgsql
          coverage: xdebug
          tools: composer:v2
        env:
          XDEBUG_MODE: coverage

      - name: Install dependencies
        working-directory: packages/documents
        run: composer install --prefer-dist --no-interaction --no-progress

      # R02 proved that pest-plugin-mutate v4.0.1 plus --parallel reports a false
      # 100%. Documents has PG-only coverage, so its authoritative lane is
      # PostgreSQL and must stay sequential and cold. The configured floor remains
      # 95; R17's current-source cold score is measured separately.
      - name: Mutation testing
        working-directory: packages/documents
        run: vendor/bin/pest --mutate --path=src --covered-only --clear-cache --min=95
        env:
          XDEBUG_MODE: coverage

  filament:
    if: inputs.package == 'filament'
    name: Mutation filament (SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.4 (with coverage driver)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_sqlite, sqlite3
          coverage: xdebug
          tools: composer:v2
        env:
          XDEBUG_MODE: coverage

      - name: Install dependencies
        working-directory: packages/filament
        run: composer install --prefer-dist --no-interaction --no-progress

      # NO `--parallel` (VLT-MUT D2): флаг делал гейт неспособным упасть — Pest отдаёт мутант-процессу
      # argv родителя вместе с `--parallel`, ребёнок уходит в ParaTest, падает на --mutate/--path, не
      # выполнив ни одного теста, а ненулевой exit ребёнка Pest считает признаком «мутант убит». Убиты
      # были все. Доказательство: plans/VLT-MUT/findings/P0.1-parallel-defect.md.
      #
      # SQLite — единственный драйвер: драйвер-условных тестов у filament нет (VLT-MUT D6).
      #
      # R19 pins the final target at 95 after adding behavioral contracts for the 2026-09-24 cold
      # baseline's real escaped mutants. A cold sequential SQLite run on the final package source
      # killed 170/178 mutants (95.51%); see plans/remaining-evidence/R19.md.
      - name: Mutation testing
        working-directory: packages/filament
        run: vendor/bin/pest --mutate --path=src --covered-only --clear-cache --min=95
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          XDEBUG_MODE: coverage
