name: Mutation Testing

# Advisory only: runs on main merges and manual dispatch.
# Not a PR blocker — mutation testing is expensive and should be reviewed
# after the test suite is stable.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  mutation-testing:
    name: Mutation (advisory)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_sqlite, sqlite3
          coverage: xdebug
          tools: composer:v2
        env:
          XDEBUG_MODE: coverage

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-mutation-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-mutation-
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      # --min=95: floor(Score) - 5, измерено run 29202699131, headSha f9d478d, 2026-07-12 (Score: 100.00%).
      - name: Mutation testing
        run: vendor/bin/pest --mutate --path=packages/core/src --covered-only --parallel --processes=4 --min=95
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          XDEBUG_MODE: coverage
