name: Mutation Testing

# D14 (2026-10-03): long Pest --mutate lanes are not started by push.
# The --min floor below is unchanged and still applies when this workflow
# is started manually.
on:
  workflow_dispatch:

jobs:
  mutation-testing:
    name: Mutation (advisory, ${{ matrix.database-name }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - database-name: SQLite
            connection: sqlite
            database: ':memory:'
          - database-name: PostgreSQL
            connection: pgsql
            database: vaulter_core_test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: vaulter_core_test
          POSTGRES_USER: vaulter
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U vaulter -d vaulter_core_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pcntl, pdo, pdo_pgsql, pgsql, pdo_sqlite, posix, sqlite3
          coverage: xdebug
          tools: composer:v2
        env:
          XDEBUG_MODE: coverage

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Cache Composer
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-mutation-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-mutation-
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      # R02 proved that pest-plugin-mutate v4.0.1 plus --parallel reports a false
      # 100%. Keep both driver lanes sequential and cold. Core's release verdict
      # is the PG+SQLite mutation-ID union. Until an ID-merging CI gate exists,
      # require 95 in each isolated lane; passing both is stricter and implies a
      # union >=95. It does not establish the current-source score: R16's cold
      # union measurement is still pending, and the existing floor is not lowered.
      - name: Mutation testing
        run: vendor/bin/pest --mutate --path=packages/core/src --covered-only --clear-cache --min=95
        env:
          APP_ENV: testing
          DB_CONNECTION: ${{ matrix.connection }}
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: ${{ matrix.database }}
          DB_USERNAME: vaulter
          DB_PASSWORD: secret
          XDEBUG_MODE: coverage
