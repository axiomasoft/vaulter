name: AzGuard

# The vaulter-azgard package (real AzgardGuard adapter delegating to AzGuard v1
# resource and assignment-scope checks) is tested in isolation on the fast
# SQLite lane. It has no Postgres-specific critical-section tests, so a single
# lane is enough. It requires vaulter-core (path-repo), so a change to either package
# retriggers it.
on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'hotfix/**']
    paths:
      - 'packages/azgard/**'
      - 'packages/core/**'
      - '.github/workflows/azgard.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  azgard:
    # F-P4.4-02: a bare `composer install` here used to resolve exactly ONE Laravel
    # version (the constraint's upper bound) — the L12 lane never actually ran. The
    # matrix mirrors tests.yml: an explicit `composer require` per cell forces BOTH
    # declared Laravel/Testbench combinations to install and run.
    name: vaulter-azgard (SQLite lane, Laravel ${{ matrix.laravel }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - laravel: '12.*'
            testbench: '^10.0'
          - laravel: '13.*'
            testbench: '^11.0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The Composer path repo expects axiomasoft/azguard (AzGuard v1) at
      # ../azguard/packages/core. AzGuard has no tagged release: the bridge pins the
      # commit required in packages/azgard/composer.json (dev-main#<sha>, PLAN2.D56).
      - name: Checkout pinned AzGuard v1
        run: |
          sha=$(jq -r '.require["axiomasoft/azguard"] | split("#")[1]' packages/azgard/composer.json)
          git init ../azguard
          git -C ../azguard remote add origin https://github.com/axiomasoft/azguard-private.git
          git -C ../azguard fetch --depth=1 origin "$sha"
          # Path packages version themselves as dev-<branch>; the require is dev-main,
          # so the pinned commit sits on a local main branch.
          git -C ../azguard checkout -B main FETCH_HEAD

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        working-directory: packages/azgard
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Code style (Pint)
        working-directory: packages/azgard
        run: vendor/bin/pint --test

      - name: Static analysis (Larastan)
        working-directory: packages/azgard
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M

      - name: Tests (Pest)
        working-directory: packages/azgard
        run: vendor/bin/pest --ci
