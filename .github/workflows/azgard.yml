name: AzGuard

# The vaulter-azgard package (real AzgardGuard adapter delegating to AzGuard's
# scoped roles / workspace-context checks) is tested in isolation on the fast
# SQLite lane. It has no Postgres-specific critical-section tests, so a single
# lane is enough. It requires vaulter-core (path-repo), so a change to either package
# retriggers it.
on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'hotfix/**']
    paths:
      - 'packages/azgard/**'
      - 'packages/core/**'
      - '.github/workflows/azgard.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  azgard:
    # F-P4.4-02: a bare `composer install` here used to resolve exactly ONE Laravel
    # version (the constraint's upper bound) — the L12 lane never actually ran. The
    # matrix mirrors tests.yml: an explicit `composer require` per cell forces BOTH
    # declared Laravel/Testbench combinations to install and run.
    name: vaulter-azgard (SQLite lane, Laravel ${{ matrix.laravel }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - laravel: '12.*'
            testbench: '^10.0'
          - laravel: '13.*'
            testbench: '^11.0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Composer path repos expect axioma-studio/azguard-core and azguard-context
      # at packages/{core,context}. Current azguard main moved that tree under
      # legacy/0.3. de09959e is the last commit that still matches those paths.
      # Qualifying the renamed dev-main API stays with plan item P2.4.
      - name: Checkout qualified AzGuard
        run: |
          git init ../azguard
          git -C ../azguard remote add origin https://github.com/axiomasoft/azguard-private.git
          git -C ../azguard fetch --depth=1 origin de09959e238c92c1f5fdf974cfbc3202a69fbd8e
          # Path packages version themselves as dev-<branch>. The require is
          # dev-main, so the qualified commit has to sit on a local main branch.
          git -C ../azguard checkout -B main FETCH_HEAD

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        working-directory: packages/azgard
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Code style (Pint)
        working-directory: packages/azgard
        run: vendor/bin/pint --test

      - name: Static analysis (Larastan)
        working-directory: packages/azgard
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M

      - name: Tests (Pest)
        working-directory: packages/azgard
        run: vendor/bin/pest --ci
