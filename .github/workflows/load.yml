name: Load Gate

# harness, manual only: load is started by hand through
# workflow_dispatch — no PR, push or schedule trigger. Class A (error-rate, checks,
# streaming throughput, unbounded-scan counters) is BLOCKING; class B (latency) is
# advisory everywhere outside `lab`. Profile S0 is the ONLY profile that fits
# ubuntu-latest's 4 vCPU / ~14 GiB disk (tiers S/M/L run on the lab-box only,
# `slo-gates.md` §7). Jobs, selected by `inputs.run`:
#
#   smoke-perf     — S0 stand, one k6 run.
#   regression     — S0 stand, median-of-3 runs so class-B's
#                    baseline-vs-current comparison is not one noisy sample.
#   baseline-guard — runs with every manual run (cheap, no stand): `load/baselines/*` may
#                    differ from the default branch only when `rebaseline` is ticked, the
#                    manual counterpart of the old `perf-rebaseline` PR label
#                    (a silent baseline move would make "regression"
#                    mean nothing).
on:
  workflow_dispatch:
    # A dispatch must be able to pick ONE lane: measuring runner CV means five
    # smoke-perf runs, not five smoke-perf + five 60-minute regressions.
    inputs:
      run:
        description: 'Which lane to run'
        type: choice
        options: [smoke-perf, regression, both]
        default: smoke-perf
      rebaseline:
        description: 'Allow load/baselines/* to differ from the default branch (reviewed rebaseline)'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  smoke-perf:
    if: inputs.run != 'regression'
    name: smoke-perf (S0, class A blocking)
    runs-on: ubuntu-latest
    # 25, not 15: on a real runner the job also pays for `composer
    # install` and a cold `docker build` — neither is visible on a laptop with a warm
    # cache.
    timeout-minutes: 25
    env:
      TIER: S0
      LOAD_APP_PORT: 8080
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # (load/docker-compose.load.yml), and its entrypoint runs `vendor/bin/testbench
      # migrate:fresh`. On a laptop `vendor/` is simply there; on a fresh checkout it is
      # not, and the stand died before serving a single request.
      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_pgsql, pgsql
          coverage: none
          tools: composer:v2

      - name: Install dependencies (the stand bind-mounts vendor/ from the host)
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Bring up the S0 stand
        run: TIER=S0 ./load/scripts/up.sh

      - name: Wait for the SUT to serve
        # `up.sh` runs `compose up -d`, which waits for the DEPENDENCIES to be healthy but
        # not for `app` itself: its entrypoint still has to run `migrate:fresh` before nginx
        # binds. On a laptop the human's next keystroke hid that gap; a runner curls the
        # port ~0s later and gets a connection reset.
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:8080/load/health; then
              echo "SUT is serving."
              exit 0
            fi
            sleep 5
          done

          echo "::error::SUT never served /load/health — app container log follows."
          docker compose -f load/docker-compose.load.yml --env-file load/env/S0.env logs app
          exit 1

      - name: Confirm the SUT is real (not just container-healthy)
        run: |
          curl -fsS http://127.0.0.1:8080/load/health
          curl -fsS -H 'X-Load-Actor: 1' http://127.0.0.1:8080/load/storage

      - name: Seed the S0 volume+dirty envelope
        run: |
          docker compose -f load/docker-compose.load.yml --env-file load/env/S0.env exec -T app sh -c \
            'TIER=S0 vendor/bin/testbench load:seed --fresh'

      # An empty database answers 404 to every id-bound route, and k6 records that
      # as `http_req_failed` — i.e. a wiped seed is indistinguishable from an SLO failure
      # unless something asserts otherwise. It is not hypothetical: `docker compose run`
      # recreated `app` (whose entrypoint runs `migrate:fresh`) right before the measured
      # window, and the gate dutifully reported 86 % errors as a red class A.
      - name: Record the seeded row count
        run: |
          NODES="$(docker compose -f load/docker-compose.load.yml --env-file load/env/S0.env \
            exec -T postgres psql -U vaulter -d vaulter_load -tAc 'SELECT count(*) FROM v_nodes')"
          echo "v_nodes after seed: ${NODES}"
          test "${NODES}" -gt 1000
          echo "NODES_AFTER_SEED=${NODES}" >> "$GITHUB_ENV"

      - name: k6 smoke-perf (mixed.js, class-A thresholds, 1 run)
        run: TIER=S0 ./load/scripts/run.sh smoke-perf

      - name: Assert the stand was not recreated under the run
        if: always()
        run: |
          NODES="$(docker compose -f load/docker-compose.load.yml --env-file load/env/S0.env \
            exec -T postgres psql -U vaulter -d vaulter_load -tAc 'SELECT count(*) FROM v_nodes')"

          # Not an equality check: the mix creates, moves, copies and force-deletes nodes
          # by design, so the count is SUPPOSED to drift. What must never happen is the
          # floor dropping out — a `migrate:fresh` under the run leaves it at ~0.
          FLOOR=$(( NODES_AFTER_SEED / 2 ))

          if [ "${NODES}" -lt "${FLOOR}" ]; then
            echo "::error::v_nodes went ${NODES_AFTER_SEED} → ${NODES} DURING the run — the stand was rebuilt under k6 (app's entrypoint re-runs migrate:fresh). Whatever this run measured, it is not the SLO."
            exit 1
          fi

          echo "Seed intact (v_nodes: ${NODES_AFTER_SEED} → ${NODES}, workload drift) — the run measured the seeded stand."

      - name: perf-assert — server plane (class A blocking, class B advisory)
        if: always()
        run: |
          python3 load/gates/perf-assert.py \
            --summary load/results/summary.json \
            --baseline load/baselines/smoke-perf-S0.json \
            --profile smoke-perf \
            --prometheus-url http://127.0.0.1:9090 \
          | tee load/results/perf-assert.txt

      - name: Job summary
        if: always()
        run: |
          {
            echo '### VLT-LOAD smoke-perf (S0)'
            echo
            echo "not-checkable rows are server metrics P8 has not shipped yet — a green"
            echo "run here proves class A on the client-visible SLOs, NOT all 96 rows of"
            echo "slo-gates.md §3 (Code Guidance, Anti-самообман)."
            echo
            echo '```'
            tail -n 5 load/results/perf-assert.txt 2>/dev/null || echo 'perf-assert did not produce output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Tear down the stand
        if: always()
        run: TIER=S0 KEEP_VOLUMES=0 ./load/scripts/down.sh

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: smoke-perf-results
          path: |
            load/results/summary.json
            load/results/perf-assert.txt
          if-no-files-found: warn
          retention-days: 14

  regression:
    if: inputs.run != 'smoke-perf'
    name: regression (median-3)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TIER: S0
      LOAD_APP_PORT: 8080
    steps:
      # No `ref: main` pin: a scheduled run already checks out the default branch,
      # while a dispatch on any other ref got `main` — which carries no `load/` at all, so
      # the job could only ever fail. The triggering ref is the right checkout for both.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up PHP 8.4
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_pgsql, pgsql
          coverage: none
          tools: composer:v2

      - name: Install dependencies (the stand bind-mounts vendor/ from the host)
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Bring up the S0 stand
        run: TIER=S0 ./load/scripts/up.sh

      - name: Wait for the SUT to serve
        # `up.sh` runs `compose up -d`, which waits for the DEPENDENCIES to be healthy but
        # not for `app` itself: its entrypoint still has to run `migrate:fresh` before nginx
        # binds. On a laptop the human's next keystroke hid that gap; a runner curls the
        # port ~0s later and gets a connection reset.
        run: |
          for _ in $(seq 1 60); do
            if curl -fsS -o /dev/null http://127.0.0.1:8080/load/health; then
              echo "SUT is serving."
              exit 0
            fi
            sleep 5
          done

          echo "::error::SUT never served /load/health — app container log follows."
          docker compose -f load/docker-compose.load.yml --env-file load/env/S0.env logs app
          exit 1

      - name: Confirm the SUT is real (not just container-healthy)
        run: |
          curl -fsS http://127.0.0.1:8080/load/health
          curl -fsS -H 'X-Load-Actor: 1' http://127.0.0.1:8080/load/storage

      - name: Seed the S0 volume+dirty envelope
        run: |
          docker compose -f load/docker-compose.load.yml --env-file load/env/S0.env exec -T app sh -c \
            'TIER=S0 vendor/bin/testbench load:seed --fresh'

      # The loop used to die on the FIRST k6 exit 99, which skipped the median merge
      # entirely: the one step that exists to make class B's baseline stable was unreachable
      # exactly when a run was red — i.e. always, today (class A is red on S0 by calibration).
      # k6's exit code is captured, all three runs happen, the merge and perf-assert run on
      # their output, and the job still fails at the end — class A stays blocking.
      - name: k6 regression x3 (median, slo-gates.md §4.3)
        id: k6
        run: |
          rc=0

          for i in 1 2 3; do
            TIER=S0 ./load/scripts/run.sh regression || rc=$?
            cp load/results/summary.json "load/results/summary-run${i}.json"
          done

          echo "k6_rc=${rc}" >> "$GITHUB_OUTPUT"

          if [ "${rc}" -ne 0 ]; then
            echo "::warning::k6 exited ${rc} on at least one of the three runs (class A red). The median merge and perf-assert still run; the job fails at the end."
          fi

      - name: Merge 3 runs into one median summary
        run: |
          python3 - <<'PY'
          import json
          import statistics
          from pathlib import Path

          RESULTS = Path('load/results')
          runs = [json.loads((RESULTS / f'summary-run{i}.json').read_text()) for i in (1, 2, 3)]

          def median_walk(nodes):
              # Recurse into the shared shape of k6's `data.metrics.<name>.values` — a
              # tree of dicts down to numeric leaves (p(95), med, rate, count, ...).
              # Any leaf that is not numeric across all 3 runs is left as the LAST
              # run's value (e.g. `type`/`contains` — k6 metric metadata, not a sample).
              if not all(isinstance(n, dict) for n in nodes):
                  return nodes[-1]

              merged = {}
              for key in nodes[-1]:
                  values = [n[key] for n in nodes if key in n]
                  if all(isinstance(v, (int, float)) and not isinstance(v, bool) for v in values):
                      merged[key] = statistics.median(values)
                  elif all(isinstance(v, dict) for v in values):
                      merged[key] = median_walk(values)
                  else:
                      merged[key] = values[-1]
              return merged

          merged = dict(runs[-1])
          merged['metrics'] = median_walk([r['metrics'] for r in runs])
          merged['meta'] = dict(runs[-1]['meta'])
          merged['meta']['runs'] = 3

          # K6 wrote summary.json as uid 12345 (0644); the runner user cannot reopen
          # it for writing, only replace it (the directory is world-writable). Without the
          # unlink this step died with EACCES and the job silently carried the LAST run's
          # summary forward as if it were the median.
          out = RESULTS / 'summary.json'
          out.unlink(missing_ok=True)
          out.write_text(json.dumps(merged, indent=2))
          PY

      - name: perf-assert — server plane (class A blocking, class B advisory-vs-baseline)
        if: always()
        run: |
          python3 load/gates/perf-assert.py \
            --summary load/results/summary.json \
            --baseline load/baselines/smoke-perf-S0.json \
            --profile regression \
            --prometheus-url http://127.0.0.1:9090 \
          | tee load/results/perf-assert.txt

      - name: Job summary
        if: always()
        run: |
          {
            echo '### VLT-LOAD regression (S0, median-3)'
            echo
            echo '```'
            tail -n 5 load/results/perf-assert.txt 2>/dev/null || echo 'perf-assert did not produce output'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail the job on a red class A (k6 exit ≠ 0 in any of the three runs)
        if: always() && steps.k6.outputs.k6_rc != '0'
        run: |
          echo "::error::k6 exited ${{ steps.k6.outputs.k6_rc }} — class A is blocking in the regression profile (slo-gates.md §7)."
          exit 1

      - name: Tear down the stand
        if: always()
        run: TIER=S0 KEEP_VOLUMES=0 ./load/scripts/down.sh

      - name: Upload run artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: regression-results
          path: |
            load/results/summary-run1.json
            load/results/summary-run2.json
            load/results/summary-run3.json
            load/results/summary.json
            load/results/perf-assert.txt
          if-no-files-found: warn
          retention-days: 30

  baseline-guard:
    name: 'baseline diff requires the rebaseline input'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Reject a baseline diff without the rebaseline input (slo-gates.md §4.4)
        env:
          REBASELINE: ${{ inputs.rebaseline }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          git fetch --no-tags origin "${DEFAULT_BRANCH}"
          CHANGED="$(git diff --name-only "origin/${DEFAULT_BRANCH}"...HEAD -- load/baselines || true)"

          if [ -n "$CHANGED" ]; then
            echo "Changed baseline file(s):"
            echo "$CHANGED"

            if [ "$REBASELINE" != "true" ]; then
              echo "::error::load/baselines/* differs from ${DEFAULT_BRANCH} without the 'rebaseline' input — baseline moves need explicit review (slo-gates.md §4.4)."
              exit 1
            fi

            echo "rebaseline input set — baseline diff allowed."
          fi
