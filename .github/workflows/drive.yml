name: Drive

# The vaulter-drive package (file/folder tree + resumable uploads over the core
# kernel and the media CAS engine) is tested in isolation: its own gate (Pint +
# PHPStan max + Pest + 100% type-coverage) on the fast SQLite lane, plus a dedicated
# Postgres lane that executes the resumable-upload commit path (the assembled bytes go
# through the same race-free BlobStore.commit — advisory-xact-lock / FOR UPDATE
# critical sections that SKIP on SQLite). It requires vaulter-core + vaulter-media
# (path-repos), so a change to any of the three retriggers it.
on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'hotfix/**']
    paths:
      - 'packages/drive/**'
      - 'packages/core/**'
      - 'packages/media/**'
      - '.github/workflows/drive.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  drive:
    # F-P4.4-02: a bare `composer install` here used to resolve exactly ONE Laravel
    # version (the constraint's upper bound) — the L12 lane never actually ran. The
    # matrix mirrors tests.yml: an explicit `composer require` per cell forces BOTH
    # declared Laravel/Testbench combinations to install and run.
    name: vaulter-drive (SQLite lane, Laravel ${{ matrix.laravel }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - laravel: '12.*'
            testbench: '^10.0'
          - laravel: '13.*'
            testbench: '^11.0'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        working-directory: packages/drive
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Code style (Pint)
        working-directory: packages/drive
        run: vendor/bin/pint --test

      - name: Static analysis (PHPStan max)
        working-directory: packages/drive
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M

      - name: Tests (Pest)
        working-directory: packages/drive
        run: vendor/bin/pest --ci

      - name: Type coverage (100%)
        working-directory: packages/drive
        run: vendor/bin/pest --type-coverage --min=100

  # Native Pest mutation, not Infection (VLT-REMED D38 / P5.9): Infection 0.33.3 ships
  # no Pest adapter, so the step this replaced never ran a single mutant — `|| true`
  # only hid that. Own job so the coverage driver, which the SQLite lane does not need,
  # stays off the fast lanes and mutation runs once rather than once per Laravel cell.
  #
  # NO `--parallel` (VLT-MUT D2). The flag made this gate incapable of failing: Pest hands
  # each mutant subprocess the parent's argv, `--parallel` included, so the child re-enters
  # Pest\Plugins\Parallel → ParaTest, which chokes on --mutate/--path and on a --filter that
  # still carries literal quotes, exits non-zero without running a single test — and a
  # non-zero child is how Pest recognises a KILLED mutant. Every mutant was "killed"; the
  # 100.00 % this lane used to report was an artefact, not a measurement. Proof and
  # reproduction: plans/VLT-MUT/findings/P0.1-parallel-defect.md. Sequential is slow
  # (~90 min) and correct; parallelism, if it is ever needed, belongs at the job level.
  #
  # The lane runs on POSTGRES, not SQLite (mirrors the drive-pgsql service block).
  # `--covered-only` mutates only what the suite covers, and five tests — the four
  # tests/Concurrency race guards and the FK-cascade case in tests/Feature/PurgeTrashTest
  # — self-skip on SQLite. On the old SQLite lane their code (the advisory-xact-lock /
  # FOR UPDATE critical sections, cascade-delete) was therefore never mutated, so the
  # Score was computed over a smaller body of code than the package actually ships.
  # D14: do not start this long --mutate lane on push. The --min floor is unchanged.
  drive-mutation:
    if: github.event_name == 'workflow_dispatch'
    name: vaulter-drive (mutation gate)
    runs-on: ubuntu-latest

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: vaulter_test
      DB_USERNAME: vaulter
      DB_PASSWORD: secret

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vaulter
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: vaulter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vaulter -d vaulter_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.4 (with coverage driver)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_pgsql, pgsql, pcntl, posix
          coverage: xdebug
          tools: composer:v2
        env:
          XDEBUG_MODE: coverage

      - name: Install dependencies
        working-directory: packages/drive
        run: composer install --prefer-dist --no-interaction --no-progress

      # --min — ratchet ВВЕРХ (VLT-MUT D4 / дисциплина D35): цель 95, порог поднимается каждой
      # фазой и НИКОГДА не опускается. Текущее значение = floor(Score) − 5 по ЧЕСТНОМУ замеру
      # 2026-07-13 (последовательная мутация, pcov/PHP 8.4, Postgres 16, холодный кэш мутаций):
      # Score 48.34 % — 722 убито, 780 выжило, 8 таймаутов из 1510 мутантов. Прежние «100.00 %,
      # 1569 мутантов» были артефактом `--parallel`, а не измерением.
      #
      # 43 — не «планка качества», а страховка от регресса, пока P2 плана VLT-MUT добивает 780
      # выживших тестами. Опускать нельзя; поднимать — по каждому перемеру на холодном кэше.
      - name: Mutation testing
        working-directory: packages/drive
        run: vendor/bin/pest --mutate --path=src --covered-only --min=43
        env:
          XDEBUG_MODE: coverage

  drive-pgsql:
    name: vaulter-drive (Postgres upload-commit lane)
    runs-on: ubuntu-latest

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: vaulter_test
      DB_USERNAME: vaulter
      DB_PASSWORD: secret

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vaulter
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: vaulter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vaulter -d vaulter_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.4 (with pdo_pgsql)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_pgsql, pgsql, pcntl, posix
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        working-directory: packages/drive
        run: composer install --prefer-dist --no-interaction --no-progress

      # The resumable-upload suite on real Postgres: the DB_* coordinates come from the
      # job-level env above, so the upload-commit path that assembles staged bytes and
      # commits them through BlobStore.commit (advisory-xact-lock / FOR UPDATE critical
      # sections that SKIP on SQLite) now EXECUTES. tests/Concurrency carries the
      # forked-process regression guard for F-P1.4-01 (two concurrent tus PATCH at the
      # same offset — exactly one must win); it self-skips without pdo_pgsql (see
      # tests/Uploads) or without pcntl/posix (hence those two extensions above), so it
      # only ever runs here.
      - name: 'Postgres: resumable-upload suite'
        working-directory: packages/drive
        run: vendor/bin/pest --ci tests/Uploads tests/Concurrency
