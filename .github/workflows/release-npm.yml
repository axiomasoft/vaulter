name: Release (npm)

# Prepares (version-pr) and publishes the npm packages (@vaulter/vue, @vaulter/vue-collaboration, later @vaulter/client).
# The Version Packages PR is opened without any registry credential. Publishing is a separate job that runs only after
# `route` has selected the channel/line from the manifest and found the qualification evidence of this exact SHA
# (D18): no evidence, no publish, no SHA-only fallback. The registry token is read by the publish job alone. The source repository is currently private, so npm provenance
# cannot be generated. The PHP packages are released separately by monorepo-split.yml.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Avoid two release runs racing on the same branch.
concurrency:
  group: release-npm-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Versioning only: opens/updates the Version Packages PR. No registry credential is available here.
  version-pr:
    permissions:
      contents: write
      pull-requests: write
    if: github.repository == 'axiomasoft/vaulter'
    name: Version Packages PR
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          # Changesets pushes version commits/tags using this checkout credential.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: npm ci
      - uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: npm run version
          commit: 'chore(release): version packages'
          title: 'chore(release): version packages'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Channel/line routing and qualification of every npm line whose package.json version is about to be published.
  # A line is routed from the tag Changesets would create (`<tag_prefix><version>`); a malformed version, an unknown
  # channel, evidence for another SHA or a missing tgz identity refuses. This job holds no registry token.
  route:
    if: github.repository == 'axiomasoft/vaulter'
    name: Route and qualify npm lines
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      qualified: ${{ steps.route.outputs.qualified }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Download the qualification evidence of this SHA
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-qualification
          path: release-evidence
      - name: Route every npm line and require its qualification
        id: route
        run: |
          while IFS=$'\t' read -r prefix path; do
            version="$(jq -er .version "${path}/package.json")"
            php scripts/release/route-release.php --tag="${prefix}${version}" --sha="${GITHUB_SHA}" \
              --evidence-dir=release-evidence
          done < <(jq -r '.npm[] | [.tag_prefix, .path] | @tsv' release/packages.json)
          echo "qualified=true" >> "${GITHUB_OUTPUT}"

  release:
    permissions:
      contents: write
    # Publishing belongs to the canonical repository, after routing + qualification.
    # A CI mirror (ax1oma/vaulter-mirror) has no npm token and must not publish.
    if: github.repository == 'axiomasoft/vaulter' && needs.route.outputs.qualified == 'true'
    needs: route
    name: Changesets publish
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          # Changesets pushes version commits/tags using this checkout credential.

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm ci

      # Build the publishable workspaces BEFORE publish - dist/ is gitignored and
      # each package ships "files": ["dist"], so an unbuilt dist would publish empty.
      - name: Build npm workspaces
        run: npm run build

      - name: Test npm workspaces
        run: npm test

      - name: Publish the qualified packages
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
