name: Collaboration hub image (GHCR)

# Builds and publishes the reusable Vaulter collaboration hub image to GitHub Container
# Registry on a release tag, multi-arch, with build provenance + SBOM attestation. Consumers
# REFERENCE the published image (image: ghcr.io/axiomasoft/vaulter-collaboration-hub:<ver>) — see
# docs/guides/hub.md. Uses the built-in GITHUB_TOKEN (no extra secret needed);
# the first successful run creates the package, which an org admin can then make public.
#
# Trigger: push a tag like `collaboration-hub-v1.2.3` (independent of the PHP/npm release
# tags). workflow_dispatch builds (without pushing) for a manual smoke.
on:
  push:
    tags:
      - 'collaboration-hub-v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/vaulter-collaboration-hub

jobs:
  # Routing + D18 qualification before the GHCR login: the tag must select the image line, the evidence of this SHA must
  # carry the OCI digest, and the GHCR package must be probed private. No registry credential is used here.
  route:
    if: github.event_name != 'workflow_dispatch'
    name: Route and qualify the tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      qualified: ${{ steps.route.outputs.qualified }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Download the qualification evidence of this SHA
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-qualification
          path: release-evidence
      - id: route
        run: |
          php scripts/release/route-release.php --tag="${GITHUB_REF_NAME}" --sha="${GITHUB_SHA}" \
            --evidence-dir=release-evidence --github-output="${GITHUB_OUTPUT}"

  # workflow_dispatch smoke only: builds without pushing and holds no registry credential.
  smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./packages/collaboration/hub
          push: false

  # Promotion, never a build: the image was built and TESTED before qualification and is identified by its manifest
  # digest. The qualified evidence names that digest, the platform set and the SBOM; this job re-tags exactly that digest
  # (no tag is an identity, nothing is rebuilt) and only after artifact-gate.py accepts the pair. A private channel
  # requires a destination probed private.
  image:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    needs: route
    if: needs.route.outputs.qualified == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-qualification
          path: release-evidence
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Authentication first, no registry credential: the exact bytes of the external approval A must hash to the protected
      # variable before A is parsed, then the digest, platform set, SBOM, policy, tool and visibility reported for this run
      # must be exactly what A accepted. The candidate's own evidence file is only the thing being compared, never the authority.
      - name: Require the authenticated approval of the tested digest before any registry credential
        id: tested
        env:
          VAULTER_ARTIFACT_APPROVAL_SHA256: ${{ vars.VAULTER_ARTIFACT_APPROVAL_SHA256 }}
        run: |
          evidence=release-evidence/oci-tested.json
          digest="$(jq -er .digest "${evidence}")"
          python3 -I scripts/release/artifact-gate.py oci --approval release-evidence/artifact-approval.json --source-sha "${GITHUB_SHA}" \
            --digest "${digest}" --platforms "$(jq -er '.platforms | join(",")' "${evidence}")" \
            --sbom-sha256 "$(jq -er .sbom_sha256 "${evidence}")" --policy-sha256 "$(jq -er .policy_sha256 "${evidence}")" \
            --tool-sha256 "$(jq -er .tool_sha256 "${evidence}")" --channel "$(jq -er .channel "${evidence}")" \
            --visibility "$(jq -er .visibility "${evidence}")"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

      - name: Log in to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: ver
        run: echo "version=${GITHUB_REF_NAME#collaboration-hub-v}" >> "$GITHUB_OUTPUT"

      - name: Promote the tested digest to the release tag
        env:
          DIGEST: ${{ steps.tested.outputs.digest }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          docker buildx imagetools create --tag "${REGISTRY}/${IMAGE_NAME}:${VERSION}" "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      # Attestations need Enterprise Cloud on a private repo (D11): off by default. A false flag means the provenance is
      # UNAVAILABLE, not that the image was signed.
      - name: Attest build provenance
        if: vars.VAULTER_ATTESTATIONS == 'true'
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1.4.4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.tested.outputs.digest }}
          push-to-registry: true

      - name: Record that attestation is unavailable
        if: vars.VAULTER_ATTESTATIONS != 'true'
        run: echo "build provenance attestation unavailable (vars.VAULTER_ATTESTATIONS is not true); the digest is not signed" >> "${GITHUB_STEP_SUMMARY}"
