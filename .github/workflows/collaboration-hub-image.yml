name: Collaboration hub image (GHCR)

# Builds and publishes the reusable Vaulter collaboration hub image to GitHub Container
# Registry on a release tag, multi-arch, with build provenance + SBOM attestation. Consumers
# REFERENCE the published image (image: ghcr.io/axiomasoft/vaulter-collaboration-hub:<ver>) — see
# docs/guides/hub.md. Uses the built-in GITHUB_TOKEN (no extra secret needed);
# the first successful run creates the package, which an org admin can then make public.
#
# Trigger: push a tag like `collaboration-hub-v1.2.3` (independent of the PHP/npm release
# tags). workflow_dispatch builds (without pushing) for a manual smoke.
on:
  push:
    tags:
      - 'collaboration-hub-v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/vaulter-collaboration-hub

jobs:
  # Routing + D18 qualification before the GHCR login: the tag must select the image line, the evidence of this SHA must
  # carry the OCI digest, and the GHCR package must be probed private. No registry credential is used here.
  route:
    if: github.event_name != 'workflow_dispatch'
    name: Route and qualify the tag
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      qualified: ${{ steps.route.outputs.qualified }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Download the qualification evidence of this SHA
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-qualification
          path: release-evidence
      - id: route
        run: |
          php scripts/release/route-release.php --tag="${GITHUB_REF_NAME}" --sha="${GITHUB_SHA}" \
            --evidence-dir=release-evidence --github-output="${GITHUB_OUTPUT}"

  image:
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    needs: route
    if: always() && (github.event_name == 'workflow_dispatch' || needs.route.outputs.qualified == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      # high/critical advisory is present in the runtime dependency tree before we ship.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Audit dependencies
        working-directory: ./packages/collaboration/hub
        run: |
          npm ci --no-audit --no-fund
          npm audit --omit=dev --audit-level=high

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        if: github.event_name != 'workflow_dispatch'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Strip the `collaboration-hub-v` tag prefix → bare semver for the image tags.
      - id: ver
        run: echo "version=${GITHUB_REF_NAME#collaboration-hub-v}" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.ver.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.ver.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.ver.outputs.version }}

      - id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: ./packages/collaboration/hub
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Provenance is attested by the dedicated step below (avoid duplicate
          # provenance attestations for the same digest); keep the SBOM here.
          provenance: false
          sbom: true

      - name: Attest build provenance
        if: github.event_name != 'workflow_dispatch'
        uses: actions/attest-build-provenance@ef244123eb79f2f7a7e75d99086184180e6d0018 # v1.4.4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
