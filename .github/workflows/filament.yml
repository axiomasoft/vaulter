name: Filament

# The Filament package is tested in isolation against a Filament-compatible
# Laravel so it never constrains the core Tests matrix (which spans Laravel 12 & 13).
on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'hotfix/**']
    paths:
      - 'packages/filament/**'
      - 'packages/core/**'
      - '.github/workflows/filament.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  filament:
    name: vaulter-filament (Filament 5)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        working-directory: packages/filament
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Code style (Pint)
        working-directory: packages/filament
        run: vendor/bin/pint --test

      - name: Static analysis (Larastan)
        working-directory: packages/filament
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M

      - name: Tests (Pest)
        working-directory: packages/filament
        run: vendor/bin/pest --ci

      - name: Type coverage (100%)
        working-directory: packages/filament
        run: vendor/bin/pest --type-coverage --min=100

      # F-P4.4-01: package-local Rector config (rector.php), advisory only — see
      # code-style.yml's root Rector step for the same rationale (pre-existing backlog
      # out of this item's remediation scope).
      - name: Rector (dry-run, advisory)
        working-directory: packages/filament
        run: vendor/bin/rector process --dry-run --no-progress-bar || true

  # Native Pest mutation, not Infection (VLT-REMED D38 / P5.9): Infection 0.33.3 ships
  # no Pest adapter, so the step this replaced never ran a single mutant — `|| true`
  # only hid that. The threshold is real and the job has no `|| true`: Pest exits
  # non-zero when Score drops below it. Own job so the coverage driver, which the main
  # lane does not need, stays off it.
  filament-mutation:
    name: vaulter-filament (mutation gate)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.4 (with coverage driver)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_sqlite, sqlite3
          coverage: xdebug
          tools: composer:v2
        env:
          XDEBUG_MODE: coverage

      - name: Install dependencies
        working-directory: packages/filament
        run: composer install --prefer-dist --no-interaction --no-progress

      # --min=95: floor(Score) - 5, измерено 2026-07-13 на pcov/PHP 8.5,
      # `pest --mutate --path=src --covered-only --parallel` → Score 100.00%,
      # 189 mutations tested.
      - name: Mutation testing
        working-directory: packages/filament
        run: vendor/bin/pest --mutate --path=src --covered-only --parallel --processes=4 --min=95
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          XDEBUG_MODE: coverage
