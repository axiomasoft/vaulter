name: Filament

# The Filament package is tested in isolation against a Filament-compatible
# Laravel so it never constrains the core Tests matrix (which spans Laravel 12 & 13).
on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'hotfix/**']
    paths:
      - 'packages/filament/**'
      - 'packages/core/**'
      - '.github/workflows/filament.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  filament:
    name: vaulter-filament (Filament 5)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        working-directory: packages/filament
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Code style (Pint)
        working-directory: packages/filament
        run: vendor/bin/pint --test

      - name: Static analysis (Larastan)
        working-directory: packages/filament
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M

      - name: Tests (Pest)
        working-directory: packages/filament
        run: vendor/bin/pest --ci

      - name: Type coverage (100%)
        working-directory: packages/filament
        run: vendor/bin/pest --type-coverage --min=100

      # F-P4.4-01: package-local Rector config (rector.php), advisory only — see
      # code-style.yml's root Rector step for the same rationale (pre-existing backlog
      # out of this item's remediation scope).
      - name: Rector (dry-run, advisory)
        working-directory: packages/filament
        run: vendor/bin/rector process --dry-run --no-progress-bar || true

  # Native Pest mutation, not Infection (VLT-REMED D38 / P5.9): Infection 0.33.3 ships
  # no Pest adapter, so the step this replaced never ran a single mutant — `|| true`
  # only hid that. The threshold is real and the job has no `|| true`: Pest exits
  # non-zero when Score drops below it. Own job so the coverage driver, which the main
  # lane does not need, stays off it.
  filament-mutation:
    name: vaulter-filament (mutation gate)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.4 (with coverage driver)
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_sqlite, sqlite3
          coverage: xdebug
          tools: composer:v2
        env:
          XDEBUG_MODE: coverage

      - name: Install dependencies
        working-directory: packages/filament
        run: composer install --prefer-dist --no-interaction --no-progress

      # NO `--parallel` (VLT-MUT D2): флаг делал гейт неспособным упасть — Pest отдаёт мутант-процессу
      # argv родителя вместе с `--parallel`, ребёнок уходит в ParaTest, падает на --mutate/--path, не
      # выполнив ни одного теста, а ненулевой exit ребёнка Pest считает признаком «мутант убит». Убиты
      # были все. Доказательство: plans/VLT-MUT/findings/P0.1-parallel-defect.md.
      #
      # SQLite — единственный драйвер: драйвер-условных тестов у filament нет (VLT-MUT D6).
      #
      # --min — ratchet ВВЕРХ (D4/D35): цель 95, поднимается каждой фазой, НИКОГДА не опускается.
      # 54 = floor(59.26) − 5 по честному замеру 2026-07-13 (последовательно, pcov/PHP 8.4, холодный
      # кэш): Score 59.26 % — 112 убито, 77 выжило из 189 мутантов. Число мутантов совпало с прежним,
      # Score — нет: их «убивал» сломанный флаг, а не тесты. 91 % выживших — в NodeShareResource (45)
      # и NodeGrantResource (25), т.е. в формах выдачи прав. Добивание — фаза P6 плана VLT-MUT.
      - name: Mutation testing
        working-directory: packages/filament
        run: vendor/bin/pest --mutate --path=src --covered-only --min=54
        env:
          DB_CONNECTION: sqlite
          DB_DATABASE: ':memory:'
          XDEBUG_MODE: coverage
