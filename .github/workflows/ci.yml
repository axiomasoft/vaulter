name: CI

# The one pull-request workflow (test-strategy#ci-target). It always runs — no path filter —
# and `changes` decides what is needed from `scripts/t --changed --dry-run --json` against the exact base
# commit (pull_request.base.sha / push.before). Without a usable base every lane runs. `CI gate` is the only
# check a branch rule or a release has to require: it needs every other job and is red on a failure, a
# cancellation, a skipped lane that was expected or an empty required matrix; a docs-only skip is explicit
# (changes.skip_reason). Load stays manual (load.yml); coverage, the extended
# layer and the stand run in weekly-full.yml.
#
# job map from the earlier workflows (nothing that ran on a PR was dropped):
#   tests.yml test (Laravel 12/13, SQLite, composer test:types) .. fast (+ type coverage per cell)
#   tests.yml test-pgsql (per TestCase schema steps) ....... db (pgsql, schema partitions) + serial (pgsql)
#   {drive,media,documents}.yml SQLite lane ................ fast, quality (own Pint + PHPStan)
#   {drive,media,documents}.yml *-pgsql lane ............... db (pgsql) + serial (pgsql)
#   azguard.yml, filament.yml ............................... fast, quality (filament Rector stays advisory)
#   code-style.yml (Pint + advisory Rector) ................ quality (core entry = repository-wide Pint)
#   static-analysis.yml (Larastan) ......................... quality
#   frontend.yml Vue ....................................... vue
#   openapi.yml oasdiff breaking ........................... contract-bc (blocking where the BC host is provisioned)
#   new: mysql lane (db), repo harness + policy + actionlint (repo), spec validation (openapi),
#        clean-consumer isolation of the split packages (consumer-isolation)
on:
  push:
    branches: [main, 'feat/**', 'fix/**', 'hotfix/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # The actual PHP support, checked against composer.json/groups.php by scripts/ci/workflow-policy.py.
  # Laravel 13 pairs with Testbench ^11. One line for every package, including filament.
  PHP_SUPPORT: '{"core":{"dir":".","lines":["13"],"database":true,"serial":true,"types":true,"rector":true,"azguard":false},"integration":{"dir":".","lines":["13"],"database":true,"serial":true,"types":true,"rector":true,"azguard":false},"media":{"dir":"packages/media","lines":["13"],"database":true,"serial":true,"types":true,"rector":false,"azguard":false},"drive":{"dir":"packages/drive","lines":["13"],"database":true,"serial":true,"types":true,"rector":false,"azguard":false},"documents":{"dir":"packages/documents","lines":["13"],"database":true,"serial":true,"types":true,"rector":false,"azguard":false},"webhooks":{"dir":"packages/webhooks","lines":["13"],"database":true,"serial":true,"types":true,"rector":false,"azguard":false},"azguard":{"dir":"packages/azguard","lines":["13"],"database":true,"serial":false,"types":false,"rector":false,"azguard":true},"filament":{"dir":"packages/filament","lines":["13"],"database":false,"serial":false,"types":true,"rector":true,"azguard":false}}'

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      skip_reason: ${{ steps.plan.outputs.skip_reason }}
      mode: ${{ steps.plan.outputs.mode }}
      has_quality: ${{ steps.plan.outputs.has_quality }}
      has_fast: ${{ steps.plan.outputs.has_fast }}
      has_db: ${{ steps.plan.outputs.has_db }}
      has_serial: ${{ steps.plan.outputs.has_serial }}
      has_consumer: ${{ steps.plan.outputs.has_consumer }}
      has_vue: ${{ steps.plan.outputs.has_vue }}
      has_repo: ${{ steps.plan.outputs.has_repo }}
      has_openapi: ${{ steps.plan.outputs.has_openapi }}
      has_contract_bc: ${{ steps.plan.outputs.has_contract_bc }}
      contract_bc_provisioned: ${{ steps.plan.outputs.contract_bc_provisioned }}
      contract_bc_required_lines: ${{ steps.plan.outputs.contract_bc_required_lines }}
      contract_bc_selected_lines: ${{ steps.plan.outputs.contract_bc_selected_lines }}
      quality_matrix: ${{ steps.plan.outputs.quality_matrix }}
      fast_matrix: ${{ steps.plan.outputs.fast_matrix }}
      db_matrix: ${{ steps.plan.outputs.db_matrix }}
      serial_matrix: ${{ steps.plan.outputs.serial_matrix }}
      consumer_matrix: ${{ steps.plan.outputs.consumer_matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup PHP 8.4
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.4'
          coverage: none

      - name: Plan the lanes
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          # contract-bc is planned only when the trusted BC host is provisioned (any BC_HOST_* variable set).
          BC_HOST_BOOTSTRAP: ${{ vars.BC_HOST_BOOTSTRAP }}
          BC_HOST_PYTHON: ${{ vars.BC_HOST_PYTHON }}
        run: |
          set -euo pipefail
          PHP84_BIN="$(command -v php)"
          export PHP84_BIN
          base=''
          case "$EVENT_NAME" in
            pull_request) base="$PR_BASE_SHA" ;;
            push) base="$PUSH_BEFORE" ;;
          esac
          mode=changed
          if [[ -z "$base" || "$base" == '0000000000000000000000000000000000000000' ]]; then
            mode=all
            echo "::notice::no base commit for $EVENT_NAME: every lane runs"
          elif ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            mode=all
            echo "::notice::base $base is not in the checkout (force-push?): every lane runs"
          fi

          args=(--mode "$mode")
          if [[ "$mode" == changed ]]; then
            select_plan() {
              local file="$1" code=0
              shift
              scripts/t --changed --base="$base" "$@" --dry-run --json > "$file" || code=$?
              # 2 = unknown path or harness change: the plan is the full affected set, which is still a plan.
              if (( code != 0 && code != 2 )); then
                cat "$file" >&2 || true
                exit "$code"
              fi
            }
            select_plan "$RUNNER_TEMP/changes.json"
            select_plan "$RUNNER_TEMP/db-pgsql.json" --db=pgsql
            select_plan "$RUNNER_TEMP/db-mysql.json" --db=mysql
            args+=(--changes "$RUNNER_TEMP/changes.json" --db-pgsql "$RUNNER_TEMP/db-pgsql.json" --db-mysql "$RUNNER_TEMP/db-mysql.json")
          fi

          python3 scripts/ci/workflow-policy.py plan "${args[@]}" --php 8.4,8.5 | tee "$RUNNER_TEMP/plan.out" >> "$GITHUB_OUTPUT"
          {
            echo '### CI plan'
            echo '```'
            cat "$RUNNER_TEMP/plan.out"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  quality:
    name: Quality / ${{ matrix.package }} / PHP ${{ matrix.php }}
    needs: changes
    if: needs.changes.outputs.has_quality == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.quality_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_sqlite, sqlite3
          coverage: none
          tools: composer:v2

      - name: Prepare pinned Composer workspace repositories
        run: scripts/ci/checkout-ecosystem.sh

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-quality-${{ matrix.package }}-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-quality-${{ matrix.package }}-
            ${{ runner.os }}-composer-

      - name: Install dependencies
        working-directory: ${{ matrix.dir }}
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Code style (Pint)
        working-directory: ${{ matrix.dir }}
        run: vendor/bin/pint --test

      # Larastan boots the Testbench skeleton in every PHPStan worker; on a fresh install the
      # workers race to write its discovery manifests, and a worker that loses the race types
      # every console option()/argument() as mixed (flaky errors). Write them once first.
      - name: Build the Testbench discovery manifests
        working-directory: ${{ matrix.dir }}
        run: vendor/bin/testbench package:discover

      - name: Static analysis (PHPStan max)
        working-directory: ${{ matrix.dir }}
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Verify the PHPStan stop-rails reject their negative fixtures
        if: matrix.package == 'core'
        run: scripts/ci/check-stop-rail-diagnostics.sh

      # Advisory: the Rector backlog is not part of any change, so a finding must not turn a PR red.
      - name: Rector (dry-run, advisory)
        if: matrix.rector
        continue-on-error: true
        working-directory: ${{ matrix.dir }}
        run: vendor/bin/rector process --dry-run --no-progress-bar

  fast:
    name: Fast / ${{ matrix.package }} / Laravel ${{ matrix.laravel }} / PHP ${{ matrix.php }}
    needs: changes
    if: needs.changes.outputs.has_fast == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.fast_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false


      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_sqlite, sqlite3, pcntl, posix
          coverage: none
          tools: composer:v2

      - name: Prepare pinned Composer workspace repositories
        run: scripts/ci/checkout-ecosystem.sh

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ matrix.package }}-laravel${{ matrix.laravel }}-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-${{ matrix.package }}-laravel${{ matrix.laravel }}-
            ${{ runner.os }}-composer-

      # An explicit `composer require` per cell: a bare install resolves ONE Laravel (the constraint's upper bound).
      - name: Install dependencies (Laravel ${{ matrix.laravel }})
        env:
          LARAVEL: ${{ matrix.laravel }}
          TESTBENCH: ${{ matrix.testbench }}
        run: |
          composer require "laravel/framework:$LARAVEL" "orchestra/testbench:$TESTBENCH" --dev --no-interaction --no-update
          composer update --prefer-dist --no-interaction --no-progress

      - name: Verify the installed versions
        env:
          LARAVEL: ${{ matrix.laravel }}
          TESTBENCH: ${{ matrix.testbench }}
        run: |
          set -euo pipefail
          installed_laravel="$(composer show laravel/framework --format=json | jq -r '.versions[0]')"
          installed_testbench="$(composer show orchestra/testbench --format=json | jq -r '.versions[0]')"
          echo "laravel/framework $installed_laravel, orchestra/testbench $installed_testbench"
          installed_laravel="${installed_laravel#v}"
          installed_testbench="${installed_testbench#v}"
          expected_testbench="${TESTBENCH#^}"
          if [[ "${installed_laravel%%.*}" != "${LARAVEL%%.*}" ]]; then
            echo "::error::expected Laravel ${LARAVEL}, installed ${installed_laravel}"
            exit 1
          fi
          if [[ "${installed_testbench%%.*}" != "${expected_testbench%%.*}" ]]; then
            echo "::error::expected Testbench ${TESTBENCH}, installed ${installed_testbench}"
            exit 1
          fi

      - name: Tests (SQLite, parallel)
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          PHP84_BIN="$(command -v php)"
          export PHP84_BIN
          scripts/t sqlite -p "$PACKAGE" -j 4

      - name: Type coverage (100%)
        if: matrix.types
        working-directory: ${{ matrix.dir }}
        run: |
          if [[ ! -e vendor ]]; then ln -s "$GITHUB_WORKSPACE/vendor" vendor; fi
          "$GITHUB_WORKSPACE/vendor/bin/pest" --type-coverage --min=100

  db:
    name: DB / ${{ matrix.engine }} ${{ matrix.version }} / ${{ matrix.package }}
    # Fast gate first: the server lanes start once the SQLite lane is green (or not needed), so a change that is
    # already red on SQLite does not also spend the database matrix. A skip caused by a red gate stays red in ci-gate.
    needs: [changes, fast]
    if: >-
      !cancelled() && needs.changes.outputs.has_db == 'true'
      && (needs.fast.result == 'success' || needs.fast.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.db_matrix) }}
    env:
      # A ready CI service: scripts/test-db.sh starts nothing, creates the per-worker databases and
      # refuses a database that does not end in _test.
      DB_EXTERNAL: '1'
      DB_HOST: 127.0.0.1
      DB_PORT: ${{ matrix.port }}
      DB_DATABASE: vaulter_test
      DB_USERNAME: ${{ matrix.username }}
      DB_PASSWORD: secret
    # The data directories live on tmpfs (`--tmpfs` is a docker create option; `services.<id>.command` is not
    # supported by Actions, so server flags such as fsync=off cannot be passed and the image defaults stay).
    # One service: a Postgres cell does not wait for MySQL to become healthy, and the reverse.
    # PostgreSQL 18 stores data under /var/lib/postgresql (not .../data). Both images are digest-pinned.
    services:
      db:
        image: ${{ (matrix.version == '18.7' && 'postgres:18.7-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71') || (matrix.version == '19.0' && 'postgres:19.0-alpine@sha256:8b0ff4cdf221f0c53d7fcda681d3b461be725c492cd881c5ec9c0ad25023f188') || 'mysql:9.7@sha256:df90258da46f6e7ff8574ff84f17618aba0765cac749928299c69fd4e7cb8ad8' }}
        env:
          POSTGRES_USER: ${{ matrix.username }}
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: vaulter_test
          MYSQL_ROOT_PASSWORD: secret
          MYSQL_DATABASE: vaulter_test
        ports:
          - ${{ matrix.port }}:${{ matrix.engine == 'pgsql' && '5432' || '3306' }}
        options: ${{ matrix.engine == 'pgsql' && '--tmpfs /var/lib/postgresql --health-cmd "pg_isready -U vaulter -d vaulter_test" --health-interval 5s --health-timeout 5s --health-retries 10' || '--tmpfs /var/lib/mysql --health-cmd "mysqladmin ping -h 127.0.0.1 -psecret" --health-interval 5s --health-timeout 5s --health-retries 20' }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false


      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_pgsql, pgsql, pdo_mysql, pdo_sqlite, sqlite3, pcntl, posix
          coverage: none
          tools: composer:v2

      - name: Prepare pinned Composer workspace repositories
        run: scripts/ci/checkout-ecosystem.sh

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-db-${{ matrix.package }}-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-db-${{ matrix.package }}-
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      # The database group: every test whose result depends on the engine (CAS locks, upload commit, yjs bytea,
      # jsonb gin indexes, id strategies, table prefix, ...). The runner splits it into schema partitions, one Pest
      # process per TestCase schema, with a database per parallel worker.
      - name: Database tests (${{ matrix.engine }})
        env:
          ENGINE: ${{ matrix.engine }}
          PACKAGE: ${{ matrix.package }}
        run: |
          PHP84_BIN="$(command -v php)"
          export PHP84_BIN
          scripts/t "$ENGINE" -p "$PACKAGE" --group=database -j 4

  serial:
    name: Serial / pgsql / ${{ matrix.package }}
    # Fast gate first: the server lanes start once the SQLite lane is green (or not needed), so a change that is
    # already red on SQLite does not also spend the database matrix. A skip caused by a red gate stays red in ci-gate.
    needs: [changes, fast]
    if: >-
      !cancelled() && needs.changes.outputs.has_serial == 'true'
      && (needs.fast.result == 'success' || needs.fast.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.serial_matrix) }}
    env:
      DB_EXTERNAL: '1'
      DB_HOST: 127.0.0.1
      DB_PORT: '5432'
      DB_DATABASE: vaulter_test
      DB_USERNAME: vaulter
      DB_PASSWORD: secret
    services:
      postgres:
        image: ${{ matrix.version == '18.7' && 'postgres:18.7-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71' || 'postgres:19.0-alpine@sha256:8b0ff4cdf221f0c53d7fcda681d3b461be725c492cd881c5ec9c0ad25023f188' }}
        env:
          POSTGRES_USER: vaulter
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: vaulter_test
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql
          --health-cmd "pg_isready -U vaulter -d vaulter_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_pgsql, pgsql, pdo_sqlite, sqlite3, pcntl, posix
          coverage: none
          tools: composer:v2

      - name: Prepare pinned Composer workspace repositories
        run: scripts/ci/checkout-ecosystem.sh

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-serial-${{ matrix.package }}-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-serial-${{ matrix.package }}-
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      # Forked-process races, tus PATCH at one offset, tenant provisioning: one process, no parallel workers. The
      # forked harnesses self-skip without pdo_pgsql/pcntl/posix, so a skip here is a failure (--no-skips).
      - name: Serial tests (pgsql, one process, no skips)
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          PHP84_BIN="$(command -v php)"
          export PHP84_BIN
          scripts/t pgsql -p "$PACKAGE" --group=serial -j1 --no-skips

  # Each consumer package is built in an empty directory with path repositories ONLY on the siblings
  # it declares (scripts/release/consumer-check.sh), then its fast sqlite set runs there. The repository vendor/ and
  # packages/core/tests are not on the path, so an undeclared dependency or a `../core/tests` reach fails the job.
  # Blocking: ci-gate needs it. The lane follows `changes`: a consumer package that changed (or its dependants), and
  # every consumer package when the manifest, scripts/ or the workflows changed. Zip-archive qualification is not part of this workflow.
  consumer-isolation:
    name: Consumer isolation / ${{ matrix.package }} / PHP ${{ matrix.php }}
    needs: changes
    if: needs.changes.outputs.has_consumer == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.consumer_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_sqlite, sqlite3, pcntl, posix
          coverage: none
          tools: composer:v2

      - name: Prepare pinned Composer workspace repositories
        run: scripts/ci/checkout-ecosystem.sh

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-consumer-${{ matrix.package }}-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-consumer-${{ matrix.package }}-
            ${{ runner.os }}-composer-

      - name: Clean consumer (${{ matrix.package }})
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          PHP84_BIN="$(command -v php)"
          export PHP84_BIN
          scripts/release/consumer-check.sh "$PACKAGE"

  vue:
    name: "@vaulter/vue (Node ${{ matrix.node }})"
    needs: changes
    if: needs.changes.outputs.has_vue == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Only the current Node line is supported (engines.node >=26.13.1).
        node: ['26.13.1']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js ${{ matrix.node }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}

      - name: Smoke test the Node runtime
        run: |
          sudo apt-get install -y libatomic1 libstdc++6
          node -e "process.exit(0)"

      - name: Install dependencies
        run: npm ci

      # The committed API types must be exactly what openapi/vaulter-v1.yaml generates.
      - name: Generated API types are current
        run: npm run api:check --workspace @vaulter/vue

      # Declaration freshness is separate from the trusted predecessor comparison and OpenAPI types.
      - name: Public declaration surface is current
        run: npm run api:surface:check --workspace @vaulter/vue

      - name: Type-check
        run: npm run typecheck --workspace @vaulter/vue

      - name: Test
        run: npm run test --workspace @vaulter/vue

      - name: Build
        run: npm run build --workspace @vaulter/vue

  repo:
    name: Repo harness, workflow policy, actionlint / PHP ${{ matrix.php }}
    needs: changes
    if: needs.changes.outputs.has_repo == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo, pdo_sqlite, sqlite3, pcntl, posix
          coverage: none
          tools: composer:v2

      - name: Prepare pinned Composer workspace repositories
        run: scripts/ci/checkout-ecosystem.sh

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Get Composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - name: Cache Composer
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-repo-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            ${{ runner.os }}-composer-repo-
            ${{ runner.os }}-composer-

      - name: Validate composer
        run: |
          composer validate --no-check-publish
          composer validate packages/core/composer.json --strict

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      # TestGroupsTest lists the drive suite's groups with the drive phpunit.xml, whose bootstrap is the drive vendor.
      - name: Install drive dependencies
        working-directory: packages/drive
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Workflow policy
        run: |
          python3 -m pip install 'pyyaml==6.0.2'
          python3 scripts/ci/workflow-policy.py
          python3 -m unittest discover -s tests/Repo -p WorkflowPolicyTest.py

      # The harness is exercised without any Laravel matrix: scripts/t, the selector, the zone map and the groups.
      - name: Repo harness tests
        run: |
          PHP84_BIN="$(command -v php)"
          export PHP84_BIN
          scripts/t sqlite -p repo

      # The guides' links, en/ru mirror and code fragments stay in step with the code (scripts/check-doc-*.php).
      - name: Documentation links and fragments
        run: |
          php scripts/check-doc-links.php docs README.md
          php scripts/check-doc-links.php --mirror docs
          php scripts/check-doc-snippets.php docs

      - name: actionlint
        run: docker run --rm -v "$PWD":/repo -w /repo rhysd/actionlint:1.7.7@sha256:887a259a5a534f3c4f36cb02dca341673c6089431057242cdc931e9f133147e9

  openapi:
    name: OpenAPI spec validation
    needs: changes
    if: needs.changes.outputs.has_openapi == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      # Blocking validation: the document parses, is OpenAPI 3, every local $ref resolves and operationIds are
      # unique. The trusted contract-bc lane compares both specifications against their release-line bases.
      - name: Validate openapi/vaulter-v1.yaml
        run: |
          python3 -m pip install 'pyyaml==6.0.2'
          python3 - <<'PY'
          import sys
          import yaml

          spec = yaml.safe_load(open('openapi/vaulter-v1.yaml', encoding='utf-8'))
          errors = []
          if not str(spec.get('openapi', '')).startswith('3.'):
              errors.append(f"openapi version is {spec.get('openapi')!r}, expected 3.x")
          if not spec.get('paths'):
              errors.append('no paths')
          operation_ids = {}

          def resolve(ref):
              node = spec
              for part in ref[2:].split('/'):
                  part = part.replace('~1', '/').replace('~0', '~')
                  if not isinstance(node, dict) or part not in node:
                      return False
                  node = node[part]
              return True

          def walk(node, where):
              if isinstance(node, dict):
                  ref = node.get('$ref')
                  if isinstance(ref, str) and ref.startswith('#/') and not resolve(ref):
                      errors.append(f'{where}: unresolved {ref}')
                  operation_id = node.get('operationId')
                  if isinstance(operation_id, str):
                      if operation_id in operation_ids:
                          errors.append(f'{where}: operationId {operation_id} repeats {operation_ids[operation_id]}')
                      operation_ids[operation_id] = where
                  for key, value in node.items():
                      walk(value, f'{where}/{key}')
              elif isinstance(node, list):
                  for index, value in enumerate(node):
                      walk(value, f'{where}/{index}')

          walk(spec, '')
          for error in errors:
              print(f'FAIL {error}', file=sys.stderr)
          sys.exit(1 if errors else 0)
          PY

  # Runs only where the owner provisioned the trusted BC host (repository variables BC_HOST_*); the plan reports
  # contract_bc_provisioned=false otherwise, and ci-gate accepts the skip for that reason alone. Once any BC_HOST_*
  # variable is set the job runs and blocks, and an incomplete setup fails it.
  contract-bc:
    name: Contract BC (trusted policy)
    needs: changes
    if: needs.changes.outputs.has_contract_bc == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      BC_HOST_BOOTSTRAP: ${{ vars.BC_HOST_BOOTSTRAP }}
      BC_HOST_PYTHON: ${{ vars.BC_HOST_PYTHON }}
      BC_TOOL_ROOT: ${{ vars.BC_TOOL_ROOT }}
      BC_TOOL_REV: ${{ vars.BC_TOOL_REV }}
      BC_SHA256SUMS: ${{ vars.BC_SHA256SUMS }}
      BC_RUNTIME_APPROVAL: ${{ vars.BC_RUNTIME_APPROVAL }}
      BC_RUNTIME_APPROVAL_SHA256: ${{ vars.BC_RUNTIME_APPROVAL_SHA256 }}
      BC_SOURCE_ROOT: ${{ github.workspace }}
      BC_SOURCE_SHA: ${{ github.sha }}
      BC_REQUIRED_LINES: php-public,npm-vue
      BC_SELECTED_LINES: all
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      # Bootstrap/Python and protected read-only T are provisioned outside candidate authority.
      # Missing owner configuration blocks; this job never installs or runs candidate tools.
      - name: Exact trusted closure and contract check
        working-directory: /tmp
        run: |
          test "${BC_HOST_BOOTSTRAP:0:1}" = /
          test "${BC_HOST_PYTHON:0:1}" = /
          exec "$BC_HOST_PYTHON" -I "$BC_HOST_BOOTSTRAP"

  sca:
    name: Locked dependency advisory gate
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # Empty [] grants no waivers and requires no approval. Nonempty exceptions require this protected approval digest.
      AUDIT_SUPPRESSIONS_SHA256: ${{ vars.AUDIT_SUPPRESSIONS_SHA256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2.40.0
        with:
          php-version: '8.4'
          extensions: mbstring, pdo, pdo_pgsql, pgsql
          tools: composer:v2
          coverage: none

      - name: Prepare pinned Composer workspace repositories
        run: scripts/ci/checkout-ecosystem.sh
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.13.1'
      - name: Resolve one Composer lock and capture provenance
        run: |
          mkdir -p var/advisories
          # Root lock is ignored: resolve once without scripts/plugins or installing archives.
          composer update --no-install --no-scripts --no-plugins --no-interaction
          sha256sum composer.lock package-lock.json > var/advisories/input-locks.sha256
          composer --version > var/advisories/composer.version
          npm --version > var/advisories/npm.version
          echo 'Composer locked including dev; npm runtime omit=dev high threshold; optional package matrices and build-dev not scanned' > var/advisories/profile.txt
      - name: Enforce runtime licenses and check suppressions
        env:
          CHANGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 scripts/ci/engineering-rails.py --base "$CHANGE_BASE"

      - name: Install dependencies for PostgreSQL migration FK check
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Check PostgreSQL foreign key indexes
        run: |
          scripts/ci/postgres-fks.sh 'postgres:18.7-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71'
          scripts/ci/postgres-fks.sh 'postgres:19.0-alpine@sha256:8b0ff4cdf221f0c53d7fcda681d3b461be725c492cd881c5ec9c0ad25023f188'

      - name: Capture both raw advisory reports and statuses
        run: |
          set +e
          composer audit --locked --format=json > var/advisories/composer.json 2> var/advisories/composer.stderr
          vaulter_composer_exit=$?
          printf '%s\n' "$vaulter_composer_exit" > var/advisories/composer.exit
          npm audit --omit=dev --audit-level=high --json > var/advisories/npm.json 2> var/advisories/npm.stderr
          vaulter_npm_exit=$?
          printf '%s\n' "$vaulter_npm_exit" > var/advisories/npm.exit
          # Acquisition statuses are data for the blocking gate, not a clean verdict.
      - name: Reject incomplete reports and unapproved high or critical findings
        run: |
          python3 scripts/ci/audit-gate.py --composer-report=var/advisories/composer.json --composer-exit="$(cat var/advisories/composer.exit)" --npm-report=var/advisories/npm.json --npm-exit="$(cat var/advisories/npm.exit)" --suppressions=release/audit-suppressions.json --format=json
      - name: Preserve advisory acquisition bundle
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dependency-advisory-reports
          path: var/advisories

  ci-gate:
    name: CI gate
    if: always()
    needs: [changes, quality, fast, db, serial, consumer-isolation, vue, repo, openapi, contract-bc, sca]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # green only when `changes` says it was not needed, and an empty required matrix is red.
      - name: Verdict
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/workflow-policy.py gate
