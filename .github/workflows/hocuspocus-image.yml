name: Hocuspocus image (GHCR)

# Builds and publishes the reusable Vaulter collaboration hub image to GitHub Container
# Registry on a release tag, multi-arch, with build provenance + SBOM attestation. Consumers
# REFERENCE the published image (image: ghcr.io/axiomasoft/vaulter-hocuspocus:<ver>) — see
# docs/guides/hub.md. Uses the built-in GITHUB_TOKEN (no extra secret needed);
# the first successful run creates the package, which an org admin can then make public.
#
# Trigger: push a tag like `vaulter-hocuspocus-v1.2.3` (independent of the PHP/npm release
# tags). workflow_dispatch builds (without pushing) for a manual smoke.
on:
  push:
    tags:
      - 'vaulter-hocuspocus-v*'
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/vaulter-hocuspocus

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Supply-chain gate (master plan Addendum A.3 #11): fail the publish if a known
      # high/critical advisory is present in the runtime dependency tree before we ship.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Audit dependencies
        working-directory: ./packages/collaboration/hub
        run: |
          npm ci --no-audit --no-fund
          npm audit --omit=dev --audit-level=high

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'workflow_dispatch'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Strip the `vaulter-hocuspocus-v` tag prefix → bare semver for the image tags.
      - id: ver
        run: echo "version=${GITHUB_REF_NAME#vaulter-hocuspocus-v}" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}},value=${{ steps.ver.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ steps.ver.outputs.version }}
            type=semver,pattern={{major}},value=${{ steps.ver.outputs.version }}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: ./packages/collaboration/hub
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'workflow_dispatch' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Provenance is attested by the dedicated step below (avoid duplicate
          # provenance attestations for the same digest); keep the SBOM here.
          provenance: false
          sbom: true

      - name: Attest build provenance
        if: github.event_name != 'workflow_dispatch'
        uses: actions/attest-build-provenance@v1
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
