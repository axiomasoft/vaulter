# Testbench-стенд для e2e realtime-коллаборации (P1.1 мастер-плана).
# Поднимает живой Laravel-хост поверх packages/core через `vendor/bin/testbench serve`.
# НЕ участвует в обычных тестах (Pest гоняет SQLite :memory:); это отдельный стенд.
providers:
  - Vaulter\VaulterServiceProvider
  - Vaulter\Media\VaulterMediaServiceProvider
  - Vaulter\Drive\VaulterDriveServiceProvider
  - Vaulter\Documents\VaulterDocumentsServiceProvider
  - Vaulter\Tests\E2E\E2eServiceProvider

env:
  - APP_KEY="base64:lRknxO3IznrZODHVPvLNKylvYP19ch+EXZ8dM+i3OlY="
  - APP_URL="http://localhost:8000"
  # БД задаётся через окружение (DB_CONNECTION/DB_*). По умолчанию — персистентный
  # SQLite-файл (host dev-loop); в docker-стенде compose выставляет pgsql + Postgres.
  # Коллаборация — Hocuspocus-хаб (hocuspocus-server/), драйвер по умолчанию для стенда.
  - VAULTER_COLLAB_DRIVER="hocuspocus"
  - VAULTER_COLLAB_URL="ws://localhost:1234"
  # HS256-секрет для подписи/проверки room-JWT (минтит Laravel, верифицирует вебхук).
  - VAULTER_COLLAB_SECRET="e2e-collab-jwt-secret-change-me"
  # Общий секрет вебхуков (X-Vaulter-Collab-Secret) — должен совпасть с хабом.
  - VAULTER_COLLAB_WEBHOOK_SECRET="e2e-collab-webhook-secret"
