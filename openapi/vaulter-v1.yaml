  /collaboration/hub/append:
    post:
      operationId: collaboration.hub.append
      tags:
      - hub
      summary: 'Hub: append one update to the log of a room (protocol 2)'
      description: 'Requires X-Vaulter-Collab-Protocol: 2 (409 collaboration_protocol_mismatch otherwise). The body size is
        checked by its Content-Length and the payload by its base64 length before decoding (413 collaboration_update_too_large).
        The answer is the committed receipt: a retry with the same update_id and payload gets the same seq. The hub''s seed
        of an empty generation carries seed_state_version: it is appended only while the generation has no checkpoint and
        no record and the document''s state version still equals it (409 collaboration_seed_conflict otherwise). While
        vaulter:collaboration:drain drains the log before the module is switched off, every append answers 503
        collaboration_draining and nothing is written; the hub keeps the update and retries it with backoff.'
      security:
      - hubSecret: []
      parameters:
      - $ref: '#/components/parameters/XVaulterCollabProtocol'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - room
              - generation
              - update_id
              - sha256
              - payload
              properties:
                room:
                  type: string
                generation:
                  type: integer
                update_id:
                  type: string
                  description: UUID of the update, unchanged on every retry.
                sha256:
                  type: string
                  description: Hex sha256 of the decoded payload; checked by the backend, never trusted.
                payload:
                  type: string
                  description: Base64 Yjs update.
                origin:
                  type: string
                  enum:
                  - client
                  - server
                seed_state_version:
                  type: integer
                  minimum: 0
                  description: Only on the hub's seed (the first record of a generation, built from the JSON load returned)
                    — the state_version load returned.
      responses:
        '200':
          description: OK
          headers:
            X-Vaulter-Api-Version:
              $ref: '#/components/headers/XVaulterApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlStore'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-Vaulter-Collab-Protocol:
              $ref: '#/components/headers/XVaulterCollabProtocol'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HubAppended'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '409':
          $ref: '#/components/responses/Problem409'
        '413':
          $ref: '#/components/responses/Problem413'
        '422':
          $ref: '#/components/responses/Problem422'
        '429':
          $ref: '#/components/responses/Problem429'
        '500':
          $ref: '#/components/responses/Problem500'
        '503':
          $ref: '#/components/responses/Problem503'
  /collaboration/hub/compaction/lease:
    post:
      operationId: collaboration.hub.compaction.lease
      tags:
      - hub
      summary: 'Hub: lease document generations due for compaction (protocol 2)'
      description: 'The hub''s compaction worker, not a room connection: the body signature authenticates the call, no room
        token. Requires X-Vaulter-Collab-Protocol: 2. Up to max generations with uncheckpointed edits or a drain request, drain
        requests first; each entry carries what the hub merges (the checkpoint and the tail (checkpoint_seq, head_seq]) and
        the values its checkpoint publication repeats. A lease gives no right to append.'
      security:
      - hubSecret: []
      parameters:
      - $ref: '#/components/parameters/XVaulterCollabProtocol'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - hub_id
              properties:
                hub_id:
                  type: string
                  minLength: 1
                  maxLength: 191
                  description: The id of the hub instance; the lease owner.
                max:
                  type: integer
                  minimum: 1
                  maximum: 100
                  description: The most leases to hand out, 1..100; 1 when absent.
      responses:
        '200':
          description: OK
          headers:
            X-Vaulter-Api-Version:
              $ref: '#/components/headers/XVaulterApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlStore'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-Vaulter-Collab-Protocol:
              $ref: '#/components/headers/XVaulterCollabProtocol'
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HubCompactionLease'
        '401':
          $ref: '#/components/responses/Problem401'
        '409':
          $ref: '#/components/responses/Problem409'
        '413':
          $ref: '#/components/responses/Problem413'
        '422':
          $ref: '#/components/responses/Problem422'
        '429':
          $ref: '#/components/responses/Problem429'
        '500':
          $ref: '#/components/responses/Problem500'
  /collaboration/hub/checkpoint:
    post:
      operationId: collaboration.hub.checkpoint
      tags:
      - hub
      summary: 'Hub: publish a checkpoint merged under a compaction lease (protocol 2)'
      description: 'The hub''s compaction worker: the body signature authenticates the call, no room token. Requires X-Vaulter-Collab-Protocol:
        2. One compare-and-set: the lease holds the generation, covered_from is the last checkpoint''s sequence, expected_checkpoint_version
        its version and the document''s state version, covered_through is in the log. Otherwise 409 collaboration_checkpoint_conflict
        (a closed generation: 409 collaboration_epoch_mismatch), and nothing changes. On success the updates through covered_through
        are deleted (their receipts stay) and the pending marker is cleared when the checkpoint covers it. The body is checked
        by its Content-Length and the state by its base64 length before decoding (413 collaboration_update_too_large).'
      security:
      - hubSecret: []
      parameters:
      - $ref: '#/components/parameters/XVaulterCollabProtocol'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - document
              - generation
              - lease_token
              - covered_from
              - covered_through
              - expected_checkpoint_version
              - state
              - content
              properties:
                document:
                  type: string
                  description: The node id of the document, as the lease named it.
                generation:
                  type: integer
                  minimum: 0
                lease_token:
                  type: string
                covered_from:
                  type: integer
                  minimum: 0
                  description: The checkpoint_seq the lease reported (C).
                covered_through:
                  type: integer
                  minimum: 0
                  description: The last log sequence the checkpoint holds (H), at most the head_seq the lease reported.
                expected_checkpoint_version:
                  type: integer
                  minimum: 0
                state:
                  type: string
                  description: Base64 Yjs state of the merged checkpoint.
                content:
                  type: object
                  description: The JSON projection of the state.
      responses:
        '200':
          description: OK
          headers:
            X-Vaulter-Api-Version:
              $ref: '#/components/headers/XVaulterApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlStore'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-Vaulter-Collab-Protocol:
              $ref: '#/components/headers/XVaulterCollabProtocol'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HubCheckpointPublished'
        '401':
          $ref: '#/components/responses/Problem401'
        '404':
          $ref: '#/components/responses/Problem404'
        '409':
          $ref: '#/components/responses/Problem409'
        '413':
          $ref: '#/components/responses/Problem413'
        '422':
          $ref: '#/components/responses/Problem422'
        '429':
          $ref: '#/components/responses/Problem429'
        '500':
          $ref: '#/components/responses/Problem500'
  /collaboration/hub/renew:
    post:
      operationId: collaboration.hub.renew
      tags:
      - hub
      summary: 'Hub: renew the room token of a connection by the rights now (protocol 2)'
      description: 'Requires X-Vaulter-Collab-Protocol: 2. The bearer is the connection''s current token (accepted up to hub.clock_skew
        past its exp). The rights are checked now, as on every hub call: the new token expires hub.token_ttl from now, carries
        the current permission versions and a scope no wider than the old token''s or the subject''s rights now (a writer
        who lost Edit is renewed read-only, an archived drive renews read-only). A subject without View gets 403 permission_denied,
        a gone or trashed document 404, a past generation 409 collaboration_epoch_mismatch. The old token is not extended.'
      security:
      - hubSecret: []
      parameters:
      - $ref: '#/components/parameters/XVaulterCollabProtocol'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - room
              properties:
                room:
                  type: string
      responses:
        '200':
          description: OK
          headers:
            X-Vaulter-Api-Version:
              $ref: '#/components/headers/XVaulterApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlStore'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-Vaulter-Collab-Protocol:
              $ref: '#/components/headers/XVaulterCollabProtocol'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HubRenewed'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '409':
          $ref: '#/components/responses/Problem409'
        '422':
          $ref: '#/components/responses/Problem422'
        '429':
          $ref: '#/components/responses/Problem429'
        '500':
          $ref: '#/components/responses/Problem500'
  /collaboration/hub/recheck:
    post:
      operationId: collaboration.hub.recheck
      tags:
      - hub
      summary: 'Hub: what each named connection may do now, after a control message (protocol 2)'
      description: 'Requires X-Vaulter-Collab-Protocol: 2. The hub''s own call: the body signature authenticates it, no room token;
        every token in the body is verified on its own. Up to 200 connections, answered in order: none (close the connection;
        reason token, gone, generation, unavailable or revoked), read (read-only) or write. The body is checked by its Content-Length
        (413 collaboration_update_too_large).'
      security:
      - hubSecret: []
      parameters:
      - $ref: '#/components/parameters/XVaulterCollabProtocol'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - connections
              properties:
                connections:
                  type: array
                  minItems: 1
                  maxItems: 200
                  items:
                    type: object
                    required:
                    - id
                    - token
                    properties:
                      id:
                        type: string
                        description: The hub's own key of the connection, 1 to 191 bytes.
                      token:
                        type: string
                        description: The connection's current room token.
      responses:
        '200':
          description: OK
          headers:
            X-Vaulter-Api-Version:
              $ref: '#/components/headers/XVaulterApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlStore'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-Vaulter-Collab-Protocol:
              $ref: '#/components/headers/XVaulterCollabProtocol'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HubRecheck'
        '401':
          $ref: '#/components/responses/Problem401'
        '409':
          $ref: '#/components/responses/Problem409'
        '413':
          $ref: '#/components/responses/Problem413'
        '422':
          $ref: '#/components/responses/Problem422'
        '429':
          $ref: '#/components/responses/Problem429'
        '500':
          $ref: '#/components/responses/Problem500'
components:
  securitySchemes:
    hostAuth:
      type: http
      scheme: bearer
      description: Whatever the host application authenticates with (session, Sanctum, ...); Vaulter only needs an authenticated
        actor.
    hubSecret:
      type: apiKey
      in: header
      name: X-Vaulter-Collab-Secret
      description: Shared secret of the collaboration hub.
  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: 'The ETag of the representation you read. Missing: 428 precondition_required. `*`: 428. Weak or stale tag:
        412. Checked after authorization.'
      schema:
        type: string
    XVaulterCollabProtocol:
      name: X-Vaulter-Collab-Protocol
      in: header
      required: true
      description: 'The hub ↔ backend protocol version the call speaks: `2`. A call without it, or with any other value,
        answers 409 collaboration_protocol_mismatch before anything is read.'
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: 'One Structured Field String ("…") or one token without spaces, controls or commas; 1–255 bytes, compared
        exactly. The same key with the same request within 24 hours returns the stored response (Idempotent-Replayed: true)
        after a fresh authorization check; another request under the key answers 422 idempotency_key_reused; a request still
        running under the key answers 409 operation_in_progress with Retry-After. Malformed: 422 validation_failed.'
      schema:
        type: string
        minLength: 1
    DestinationIfMatch:
      name: X-Vaulter-Destination-If-Match
      in: header
      required: false
      description: 'The ETag of the destination folder as the caller last read it (the drive root when the destination is
        null). A move into a folder that changed since answers 412 node_sequence_mismatch; without the header the destination
        is not pinned.'
      schema:
        type: string
    IfMatchWhenReplacing:
      name: If-Match
      in: header
      required: false
      description: 'Required when the request replaces an existing node (node_id given): 428 without it, 412 on a stale tag.'
      schema:
        type: string
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: Weak comparison; a match answers 304 without a body, after authorization.
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from meta.next_cursor.
      schema:
        type: string
        maxLength: 2048
    PerPage:
      name: per_page
      in: query
      required: false
      description: Page size, 1..200, default 50.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Drive:
      name: drive
      in: path
      required: true
      description: Drive id.
      schema:
        type: string
    Node:
      name: node
      in: path
      required: true
      description: Node id.
      schema:
        type: string
    Revision:
      name: revision
      in: path
      required: true
      description: Revision id.
      schema:
        type: string
    Grant:
      name: grant
      in: path
      required: true
      description: Grant id.
      schema:
        type: string
    Share:
      name: share
      in: path
      required: true
      description: Share link id.
      schema:
        type: string
    Comment:
      name: comment
      in: path
      required: true
      description: Comment id.
      schema:
        type: string
    ShareToken:
      name: token
      in: path
      required: true
      description: Share token.
      schema:
        type: string
    Upload:
      name: upload
      in: path
      required: true
      description: Upload session id.
      schema:
        type: string
    Endpoint:
      name: endpoint
      in: path
      required: true
      description: Webhook endpoint id.
      schema:
        type: string
    Delivery:
      name: delivery
      in: path
      required: true
      description: Webhook delivery id.
      schema:
        type: string
    ExportFormat:
      name: format
      in: path
      required: true
      description: Export format, for example html, md.
      schema:
        type: string
    ShareSession:
      name: X-Share-Session
      in: header
      required: false
      description: Session token returned by a previous share response.
      schema:
        type: string
    SharePassword:
      name: X-Share-Password
      in: header
      required: false
      description: Password of a protected share.
      schema:
        type: string
    TusResumableHeader:
      name: Tus-Resumable
      in: header
      required: false
      description: tus protocol version, 1.0.0.
      schema:
        type: string
  headers:
    IdempotentReplayed:
      description: '`true` when the response was answered from the receipt of an earlier request with the same Idempotency-Key;
        its ETag is historical.'
      schema:
        type: string
        const: 'true'
    ETag:
      description: 'Strong validator of the representation. Opaque: never parse it. Send it back verbatim in If-Match.'
      schema:
        type: string
        pattern: ^"[^"]+"$
    XVaulterApiVersion:
      description: Major version of the REST API that answered.
      required: true
      schema:
        type: string
        const: '1'
    XRequestId:
      description: 'Correlation id: the caller''s X-Request-Id when well formed, else a fresh ULID.'
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9._:-]{1,64}$
    CacheControlRevalidate:
      description: 'A single resource with an ETag: stored by the client, revalidated every time.'
      required: true
      schema:
        type: string
        const: no-cache, private
    CacheControlStore:
      description: Lists, mutations, sessions, secrets, downloads and errors are never stored.
      required: true
      schema:
        type: string
        const: no-store, private
    CacheControlAny:
      description: no-cache, private when the response carries an ETag, no-store otherwise.
      required: true
      schema:
        type: string
        enum:
        - no-cache, private
        - no-store, private
    CacheControlError:
      description: Errors are never stored.
      required: true
      schema:
        type: string
        enum:
        - no-store
        - no-store, private
    Location:
      description: Absolute URL of the redirect target.
      required: true
      schema:
        type: string
    UploadLocation:
      description: 'tus only: absolute URL of the upload session.'
      schema:
        type: string
    ReferrerPolicy:
      description: no-referrer on public share responses.
      schema:
        type: string
        const: no-referrer
    ReferrerPolicyRequired:
      description: no-referrer on every public share response.
      required: true
      schema:
        type: string
        const: no-referrer
    VaryRepresentation:
      description: The representation depends on who asks.
      required: true
      schema:
        type: string
        const: Authorization, Cookie
    VaryOptional:
      description: Present when the response carries an ETag.
      schema:
        type: string
        const: Authorization, Cookie
    XShareSession:
      description: Share session token; send it back as X-Share-Session on follow-up requests.
      schema:
        type: string
    RetryAfter:
      description: 'Seconds to wait before repeating the request: until the rate limit window resets, while an operation under the same Idempotency-Key still runs (operation_in_progress), or until a competing update settles (concurrent_update). Present only on the codes that name a delay.'
      schema:
        type: integer
    XRateLimitLimit:
      description: Requests allowed per window.
      schema:
        type: integer
    XRateLimitRemaining:
      description: Requests left in the window.
      schema:
        type: integer
    XVaulterCollabProtocol:
      description: The hub ↔ backend protocol version of the answer (protocol 2 calls).
      schema:
        type: string
        const: '2'
    ContentDisposition:
      description: attachment or inline, with a filename.
      required: true
      schema:
        type: string
        pattern: ^(attachment|inline);
    ContentSecurityPolicy:
      description: Sandboxes every served byte.
      required: true
      schema:
        type: string
        const: sandbox; default-src 'none'
    XContentTypeOptions:
      description: Always nosniff.
      required: true
      schema:
        type: string
        const: nosniff
    AcceptRangesNone:
      description: Range requests are not supported in 1.0.
      required: true
      schema:
        type: string
        const: none
    ContentLength:
      description: Size of the body in bytes.
      schema:
        type: integer
    XExportLossy:
      description: 1 when the chosen format drops information of the document.
      schema:
        type: string
    TusResumable:
      description: tus protocol version.
      schema:
        type: string
        const: 1.0.0
    UploadOffset:
      description: Bytes the server holds.
      schema:
        type: integer
    UploadLength:
      description: Declared total size.
      schema:
        type: integer
    TusVersion:
      description: Supported tus versions.
      schema:
        type: string
    TusExtension:
      description: Supported tus extensions.
      schema:
        type: string
    TusMaxSize:
      description: Largest accepted upload.
      schema:
        type: integer
    ETagRequired:
      description: 'Strong validator of the representation. Opaque: never parse it. Send it back verbatim in If-Match.'
      schema:
        type: string
        pattern: ^"[^"]+"$
      required: true
  responses:
    Problem400:
      description: Malformed request (invalid_cursor, ...).
      headers:
        X-Vaulter-Api-Version:
          $ref: '#/components/headers/XVaulterApiVersion'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControlError'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem401:
      description: No authenticated actor (actor_required) or a share password is required.
      headers:
        X-Vaulter-Api-Version:
          $ref: '#/components/headers/XVaulterApiVersion'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControlError'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem403:
      description: The caller may see the resource but lacks the ability (permission_denied, profile_restriction).
      headers:
        X-Vaulter-Api-Version:
          $ref: '#/components/headers/XVaulterApiVersion'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControlError'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem404:
      description: The resource does not exist or is not visible to the caller (same answer for both).
      headers:
        X-Vaulter-Api-Version:
          $ref: '#/components/headers/XVaulterApiVersion'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControlError'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem405:
      description: Method not allowed.
      headers:
        X-Vaulter-Api-Version:
          $ref: '#/components/headers/XVaulterApiVersion'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControlError'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem409:
      description: Conflict with the current state (node_name_conflict, invalid_destination, drive_archived, ...).
      headers:
        X-Vaulter-Api-Version:
          $ref: '#/components/headers/XVaulterApiVersion'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControlError'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem410:
      description: The cursor expired (cursor_expired).
      headers:
        X-Vaulter-Api-Version:
          $ref: '#/components/headers/XVaulterApiVersion'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControlError'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem412:
      description: 'Precondition failed: the If-Match tag does not match the current representation.'
      headers:
        X-Vaulter-Api-Version:
          $ref: '#/components/headers/XVaulterApiVersion'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControlError'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem413:
      description: Payload too large or quota exceeded.
      headers:
        X-Vaulter-Api-Version:
          $ref: '#/components/headers/XVaulterApiVersion'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControlError'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem415:
      description: Unsupported media type.
      headers:
        X-Vaulter-Api-Version:
          $ref: '#/components/headers/XVaulterApiVersion'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControlError'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem422:
      description: Validation failed (validation_failed and field-bound codes).
      headers:
        X-Vaulter-Api-Version:
          $ref: '#/components/headers/XVaulterApiVersion'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControlError'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem423:
      description: Content is unavailable, for example quarantined by the scanner (content_unavailable).
      headers:
        X-Vaulter-Api-Version:
          $ref: '#/components/headers/XVaulterApiVersion'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControlError'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem428:
      description: The operation requires If-Match (precondition_required).
      headers:
        X-Vaulter-Api-Version:
          $ref: '#/components/headers/XVaulterApiVersion'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControlError'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem429:
      description: Rate limited (rate_limited).
      headers:
        X-Vaulter-Api-Version:
          $ref: '#/components/headers/XVaulterApiVersion'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControlError'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem500:
      description: Unexpected failure (internal_error).
      headers:
        X-Vaulter-Api-Version:
          $ref: '#/components/headers/XVaulterApiVersion'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControlError'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem503:
      description: Temporarily unavailable; retry with backoff (collaboration_draining).
      headers:
        X-Vaulter-Api-Version:
          $ref: '#/components/headers/XVaulterApiVersion'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControlError'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details, served as application/problem+json.
      required:
      - type
      - title
      - status
      - code
      - request_id
      properties:
        type:
          type: string
          description: URI of the error code reference (docs/reference/errors.md#<code>).
        title:
          type: string
          description: Localized, human readable summary (Content-Language).
        status:
          type: integer
          description: HTTP status, repeated from the response line.
        code:
          type: string
          description: Stable machine readable code (SemVer). A status without a Vaulter code answers http_<status>.
          examples:
          - actor_required
          - blob_unavailable
          - cannot_delete_head_revision
          - collaboration_checkpoint_conflict
          - collaboration_draining
          - collaboration_epoch_mismatch
          - collaboration_protocol_mismatch
          - collaboration_seed_conflict
          - collaboration_unavailable
          - collaboration_update_mismatch
          - collaboration_update_too_large
          - comment_not_found
          - concurrent_update
          - content_unavailable
          - cross_drive_operation
          - cursor_expired
          - dependency_unavailable
          - document_content_degraded
          - document_revision_not_found
          - document_state_mismatch
          - document_state_pending
          - document_state_too_large
          - document_type_unavailable
          - drive_archived
          - drive_not_found
          - duplicate_registration
          - extension_failed
          - file_size_limit_exceeded
          - folder_children_limit_exceeded
          - grant_not_found
          - idempotency_key_reused
          - internal_error
          - invalid_cursor
          - invalid_destination
          - invalid_document_content
          - invalid_drive_state
          - invalid_node_name
          - invalid_properties
          - invalid_webhook_signature
          - method_not_allowed
          - module_graph_invalid
          - module_not_ready
          - node_move_cycle
          - node_name_conflict
          - node_not_found
          - node_not_trashed
          - node_sequence_exhausted
          - node_sequence_mismatch
          - node_trashed_by_ancestor
          - not_a_document
          - not_a_file
          - operation_in_progress
          - payload_too_large
          - permission_denied
          - precondition_required
          - profile_restriction
          - quota_exceeded
          - rate_limited
          - registry_frozen
          - restore_destination_changed
          - restore_destination_required
          - revision_not_found
          - revision_pinned
          - route_not_found
          - share_link_ttl_exceeded
          - share_not_found
          - share_password_required
          - share_role_not_allowed
          - stale_write
          - tree_depth_limit_exceeded
          - tree_traversal_incomplete
          - unknown_document_type
          - unknown_export_format
          - unknown_profile
          - unknown_role
          - unsupported_node_kind
          - upload_conflict
          - upload_not_found
          - upload_offset_mismatch
          - upload_rejected
          - validation_failed
          - webhook_delivery_not_found
          - webhook_delivery_not_redeliverable
          - webhook_endpoint_not_found
          - write_outside_operation
        detail:
          type:
          - string
          - 'null'
          description: Localized explanation; never storage paths, tokens or SQL.
        retryable:
          type: string
          enum:
          - never
          - after_refetch
          - with_backoff
          description: Whether the request may be repeated — never as is, after refetching the resource (stale precondition), or later with backoff honouring Retry-After. Declared per code in docs/reference/errors.md.
        request_id:
          type: string
          description: Equals the X-Request-Id response header.
        errors:
          type:
          - object
          - 'null'
          description: Laravel field map for validation_failed and field-bound errors.
        meta:
          type: object
          description: Allow-listed machine readable extras (reason, header, node_id, ...).
      x-vaulter-problems:
