        created_at:
          type: string
          format: date-time
          pattern: Z$
        created_by:
          type:
          - string
          - 'null'
        updated_at:
          type: string
          format: date-time
          pattern: Z$
        updated_by:
          type:
          - string
          - 'null'
        content_modified_at:
          type:
          - string
