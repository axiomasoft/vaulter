# OpenAPI 3.1 contract of the Vaulter REST API v1 (source of truth).
# Keep it in step with the routes: packages/core/tests/OpenApi checks coverage, schemas and examples.
openapi: 3.1.1
info:
  title: Vaulter REST API
  version: 1.0.0
  summary: Drive, documents, sharing, changes and webhooks over HTTP.
  description: 'Source of truth of the v1 REST contract. Authentication is the host''s: the routes run on the stack the host
    configures (`vaulter.routes.middleware`). Every response carries X-Vaulter-Api-Version and X-Request-Id; every failure
    is `application/problem+json` (RFC 9457) with a stable `code`. Strong ETags are validators of the caller''s representation:
    opaque, never parsed. Operations that change a node or a document require If-Match (428 without, 412 when stale).'
  license:
    name: MIT
    identifier: MIT
servers:
- url: /api/vaulter/v1
  description: Default prefix; configurable through vaulter.routes.prefix.
security:
- hostAuth: []
tags:
- name: access
- name: sharing
- name: activity
- name: changes
- name: webhooks
- name: public-shares
- name: drives
- name: nodes
- name: trash
- name: files
- name: uploads
- name: documents
- name: collaboration
- name: comments
- name: hub
paths:
  /nodes/{node}/grants:
    get:
      operationId: grants.index
      tags:
      - access
      summary: List grants of a node
      parameters:
      - $ref: '#/components/parameters/Node'
      responses:
        '200':
          description: OK
          headers:
            X-Vaulter-Api-Version:
              $ref: '#/components/headers/XVaulterApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrantList'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '500':
          $ref: '#/components/responses/Problem500'
    post:
      operationId: grants.store
      tags:
      - access
      summary: Grant a role on a node
      parameters:
      - $ref: '#/components/parameters/Node'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - subject
              - role
              properties:
                subject:
                  type: object
                  required:
                  - type
                  - id
                  properties:
                    type:
                      type: string
                    id:
                      type:
                      - string
                      - integer
                role:
                  type: string
                scope:
                  type: string
                  enum:
                  - item
                  - subtree
                expires_at:
                  type: string
                  format: date-time
                  pattern: Z$
      responses:
        '201':
          description: Created
          headers:
            X-Vaulter-Api-Version:
              $ref: '#/components/headers/XVaulterApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GrantEnvelope'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '422':
          $ref: '#/components/responses/Problem422'
        '500':
          $ref: '#/components/responses/Problem500'
  /nodes/{node}/grants/{grant}:
    delete:
      operationId: grants.destroy
      tags:
      - access
      summary: Revoke a grant
      parameters:
      - $ref: '#/components/parameters/Node'
      - $ref: '#/components/parameters/Grant'
      responses:
        '204':
          description: No content
          headers:
            X-Vaulter-Api-Version:
              $ref: '#/components/headers/XVaulterApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlStore'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '500':
          $ref: '#/components/responses/Problem500'
  /nodes/{node}/inheritance/restrict:
    post:
      operationId: access.inheritance.restrict
      tags:
      - access
      summary: Stop inheriting access from the parent
      parameters:
      - $ref: '#/components/parameters/Node'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              required: []
              properties:
                mode:
                  type: string
                  enum:
                  - empty
                  - copy_current
      responses:
        '200':
          description: OK
          headers:
            X-Vaulter-Api-Version:
              $ref: '#/components/headers/XVaulterApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlStore'
            ETag:
              $ref: '#/components/headers/ETagRequired'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeEnvelope'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '422':
          $ref: '#/components/responses/Problem422'
        '500':
          $ref: '#/components/responses/Problem500'
  /nodes/{node}/inheritance/restore:
    post:
      operationId: access.inheritance.restore
      tags:
      - access
      summary: Inherit access from the parent again
      parameters:
      - $ref: '#/components/parameters/Node'
      responses:
        '200':
          description: OK
          headers:
            X-Vaulter-Api-Version:
              $ref: '#/components/headers/XVaulterApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlStore'
            ETag:
              $ref: '#/components/headers/ETagRequired'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NodeEnvelope'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '500':
          $ref: '#/components/responses/Problem500'
  /nodes/{node}/shares:
    get:
      operationId: shares.index
      tags:
      - sharing
      summary: List share links of a node
      parameters:
      - $ref: '#/components/parameters/Node'
      responses:
        '200':
          description: OK
          headers:
            X-Vaulter-Api-Version:
              $ref: '#/components/headers/XVaulterApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareList'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '500':
          $ref: '#/components/responses/Problem500'
    post:
      operationId: shares.store
      tags:
      - sharing
      summary: Create a share link (token returned once)
      parameters:
      - $ref: '#/components/parameters/Node'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: []
              properties:
                role:
                  type: string
                audience:
                  type: string
                  enum:
                  - anyone
                  - authenticated
                  - tenant
                scope:
                  type: string
                  enum:
                  - item
                  - subtree
                password:
                  type: string
                expires_at:
                  type: string
                  format: date-time
                  pattern: Z$
                max_uses:
                  type: integer
                  minimum: 1
      responses:
        '201':
          description: Created
          headers:
            X-Vaulter-Api-Version:
              $ref: '#/components/headers/XVaulterApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MintedShareEnvelope'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '422':
          $ref: '#/components/responses/Problem422'
        '500':
          $ref: '#/components/responses/Problem500'
  /nodes/{node}/shares/{share}:
    patch:
      operationId: shares.update
      tags:
      - sharing
      summary: Update a share link
      parameters:
      - $ref: '#/components/parameters/Node'
      - $ref: '#/components/parameters/Share'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: []
              properties:
                audience:
                  type: string
                  enum:
                  - anyone
                  - authenticated
                  - tenant
                password:
                  type:
                  - string
                  - 'null'
                expires_at:
                  type: string
                  format: date-time
                  pattern: Z$
                max_uses:
                  type:
                  - integer
                  - 'null'
                  minimum: 1
      responses:
        '200':
          description: OK
          headers:
            X-Vaulter-Api-Version:
              $ref: '#/components/headers/XVaulterApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareEnvelope'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '422':
          $ref: '#/components/responses/Problem422'
        '500':
          $ref: '#/components/responses/Problem500'
    delete:
      operationId: shares.destroy
      tags:
      - sharing
      summary: Revoke a share link
      parameters:
      - $ref: '#/components/parameters/Node'
      - $ref: '#/components/parameters/Share'
      responses:
        '204':
          description: No content
          headers:
            X-Vaulter-Api-Version:
              $ref: '#/components/headers/XVaulterApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlStore'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '500':
          $ref: '#/components/responses/Problem500'
  /nodes/{node}/shares/{share}/rotate:
    post:
      operationId: shares.rotate
      tags:
      - sharing
      summary: Rotate the token of a share link (new token returned once)
      parameters:
      - $ref: '#/components/parameters/Node'
      - $ref: '#/components/parameters/Share'
      responses:
        '200':
          description: OK
          headers:
            X-Vaulter-Api-Version:
              $ref: '#/components/headers/XVaulterApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MintedShareEnvelope'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '500':
          $ref: '#/components/responses/Problem500'
  /drives/{drive}/activity:
    get:
      operationId: activity.drive
      tags:
      - activity
      summary: Activity feed of a drive
      parameters:
      - $ref: '#/components/parameters/Drive'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: OK
          headers:
            X-Vaulter-Api-Version:
              $ref: '#/components/headers/XVaulterApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityPage'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '422':
          $ref: '#/components/responses/Problem422'
        '500':
          $ref: '#/components/responses/Problem500'
  /nodes/{node}/activity:
    get:
      operationId: activity.node
      tags:
      - activity
      summary: Activity feed of a node
      parameters:
      - $ref: '#/components/parameters/Node'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: OK
          headers:
            X-Vaulter-Api-Version:
              $ref: '#/components/headers/XVaulterApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActivityPage'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '422':
          $ref: '#/components/responses/Problem422'
        '500':
          $ref: '#/components/responses/Problem500'
  /drives/{drive}/changes/start:
    get:
      operationId: changes.start
      tags:
      - changes
      summary: Cursor at the current end of the change feed
      parameters:
      - $ref: '#/components/parameters/Drive'
      responses:
        '200':
          description: OK
          headers:
            X-Vaulter-Api-Version:
              $ref: '#/components/headers/XVaulterApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangesStartEnvelope'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '500':
          $ref: '#/components/responses/Problem500'
  /drives/{drive}/changes:
    get:
      operationId: changes.index
      tags:
      - changes
      summary: Read the change feed after a cursor
      parameters:
      - $ref: '#/components/parameters/Drive'
      - name: cursor
        in: query
        required: true
        description: From changes.start or the previous page.
        schema:
          type: string
          maxLength: 2048
      - name: limit
        in: query
        required: false
        description: 1..max_page_size, default 100.
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: OK
          headers:
            X-Vaulter-Api-Version:
              $ref: '#/components/headers/XVaulterApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangePage'
        '400':
          $ref: '#/components/responses/Problem400'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '410':
          $ref: '#/components/responses/Problem410'
        '422':
          $ref: '#/components/responses/Problem422'
        '500':
          $ref: '#/components/responses/Problem500'
  /webhook-endpoints:
    get:
      operationId: webhook-endpoints.index
      tags:
      - webhooks
      summary: List webhook endpoints
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: OK
          headers:
            X-Vaulter-Api-Version:
              $ref: '#/components/headers/XVaulterApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpointPage'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '422':
          $ref: '#/components/responses/Problem422'
        '500':
          $ref: '#/components/responses/Problem500'
    post:
      operationId: webhook-endpoints.store
      tags:
      - webhooks
      summary: Register a webhook endpoint (secret returned once)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - url
              - events
              properties:
                url:
                  type: string
                events:
                  type: array
                  minItems: 1
                  items:
                    type: string
                is_active:
                  type: boolean
                drive_id:
                  type: string
      responses:
        '201':
          description: Created
          headers:
            X-Vaulter-Api-Version:
              $ref: '#/components/headers/XVaulterApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpointEnvelope'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '422':
          $ref: '#/components/responses/Problem422'
        '500':
          $ref: '#/components/responses/Problem500'
  /webhook-endpoints/{endpoint}:
    get:
      operationId: webhook-endpoints.show
      tags:
      - webhooks
      summary: Show a webhook endpoint
      parameters:
      - $ref: '#/components/parameters/Endpoint'
      responses:
        '200':
          description: OK
          headers:
            X-Vaulter-Api-Version:
              $ref: '#/components/headers/XVaulterApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpointEnvelope'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '500':
          $ref: '#/components/responses/Problem500'
    patch:
      operationId: webhook-endpoints.update
      tags:
      - webhooks
      summary: Update a webhook endpoint
      parameters:
      - $ref: '#/components/parameters/Endpoint'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: []
              properties:
                url:
                  type: string
                events:
                  type: array
                  minItems: 1
                  items:
                    type: string
                is_active:
                  type: boolean
                drive_id:
                  type: string
      responses:
        '200':
          description: OK
          headers:
            X-Vaulter-Api-Version:
              $ref: '#/components/headers/XVaulterApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpointEnvelope'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '422':
          $ref: '#/components/responses/Problem422'
        '500':
          $ref: '#/components/responses/Problem500'
    delete:
      operationId: webhook-endpoints.destroy
      tags:
      - webhooks
      summary: Delete a webhook endpoint
      parameters:
      - $ref: '#/components/parameters/Endpoint'
      responses:
        '204':
          description: No content
          headers:
            X-Vaulter-Api-Version:
              $ref: '#/components/headers/XVaulterApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlStore'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '500':
          $ref: '#/components/responses/Problem500'
  /webhook-endpoints/{endpoint}/deactivate:
    post:
      operationId: webhook-endpoints.deactivate
      tags:
      - webhooks
      summary: Deactivate a webhook endpoint
      parameters:
      - $ref: '#/components/parameters/Endpoint'
      responses:
        '200':
          description: OK
          headers:
            X-Vaulter-Api-Version:
              $ref: '#/components/headers/XVaulterApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpointEnvelope'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '500':
          $ref: '#/components/responses/Problem500'
  /webhook-endpoints/{endpoint}/rotate-secret:
    post:
      operationId: webhook-endpoints.rotate-secret
      tags:
      - webhooks
      summary: Rotate the signing secret (new secret returned once)
      parameters:
      - $ref: '#/components/parameters/Endpoint'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              required: []
              properties:
                overlap_seconds:
                  type: integer
                  minimum: 0
      responses:
        '200':
          description: OK
          headers:
            X-Vaulter-Api-Version:
              $ref: '#/components/headers/XVaulterApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpointEnvelope'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '422':
          $ref: '#/components/responses/Problem422'
        '500':
          $ref: '#/components/responses/Problem500'
  /webhook-endpoints/{endpoint}/deliveries:
    get:
      operationId: webhook-deliveries.index
      tags:
      - webhooks
      summary: List deliveries of an endpoint
      parameters:
      - $ref: '#/components/parameters/Endpoint'
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/PerPage'
      responses:
        '200':
          description: OK
          headers:
            X-Vaulter-Api-Version:
              $ref: '#/components/headers/XVaulterApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookDeliveryPage'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
