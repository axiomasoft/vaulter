      type: object
      description: What each connection of a recheck may do now, in the order of the request.
      required:
      - results
      properties:
        results:
          type: array
          items:
            type: object
            required:
            - id
            - access
            - reason
            - jti
            properties:
              id:
                type: string
              access:
                type: string
                enum:
                - none
                - read
                - write
              reason:
                type:
                - string
                - 'null'
                description: 'Why access is none: token (invalid or expired), gone, generation, unavailable or revoked; null
                  otherwise.'
              jti:
                type:
                - string
                - 'null'
    HubCompactionLease:
      type: object
      description: 'A compaction lease on one document generation and what the hub merges under it, read with the lease under
        the document and head locks: the checkpoint (null before the first one, then content is the JSON to seed from) and
        the tail (checkpoint_seq, head_seq].'
      required:
      - document
      - generation
      - lease_token
      - lease_expires_at
      - checkpoint_seq
      - head_seq
      - checkpoint_version
      - type
      - schema_version
      - checkpoint
      - content
      - tail
      properties:
        document:
          type: string
          description: The node id of the document.
        generation:
          type: integer
        lease_token:
          type: string
        lease_expires_at:
          type: string
          format: date-time
        checkpoint_seq:
          type: integer
        head_seq:
          type: integer
        checkpoint_version:
          type: integer
          description: The state version the publication must expect (expected_checkpoint_version).
        type:
          type: string
        schema_version:
          type: integer
        checkpoint:
          type:
          - string
          - 'null'
          description: Base64 Yjs checkpoint, null before the first one.
        content:
          type:
          - object
          - 'null'
        tail:
          type: array
          items:
            type: object
            required:
            - seq
            - update_id
            - payload
            properties:
              seq:
                type: integer
              update_id:
                type: string
              payload:
                type: string
                description: Base64 Yjs update.
    HubCheckpointPublished:
      type: object
      description: A published checkpoint. marker_cleared is false when edits committed after the lease read the log keep
        the document pending; their updates stay in the log.
      required:
      - checkpoint_version
      - marker_cleared
      properties:
        checkpoint_version:
          type: integer
        marker_cleared:
          type: boolean
    HubLoadedV2:
      type: object
      description: 'Protocol 2 load: the checkpoint and the committed tail (checkpoint_seq, head_seq] to replay on it. Before
        the first checkpoint, content is the JSON projection to seed the room from.'
      required:
      - generation
      - schema_version
      - type
      - state_version
      - checkpoint
      - checkpoint_seq
      - head_seq
      - content
      - tail
      properties:
        generation:
          type: integer
        schema_version:
          type: integer
        type:
          type: string
        state_version:
          type: integer
        checkpoint:
          type:
          - string
          - 'null'
          description: Base64 Yjs checkpoint, null before the first one.
        checkpoint_seq:
          type: integer
        head_seq:
          type: integer
        content:
          type:
          - object
          - 'null'
        tail:
          type: array
          items:
            type: object
            required:
            - seq
            - update_id
            - payload
            properties:
              seq:
                type: integer
              update_id:
                type: string
              payload:
                type: string
                description: Base64 Yjs update.
