    HubAppended:
      type: object
      description: The committed receipt of an appended update (protocol 2), sent only after the commit.
      required:
      - generation
      - update_id
      - seq
      - sha256
      - persisted
      - permissions_stale
      properties:
        generation:
          type: integer
        update_id:
          type: string
        seq:
          type: integer
        sha256:
          type: string
        persisted:
          type: boolean
          const: true
        permissions_stale:
          type: boolean
          description: True when the token predates a change of its drive's or of every drive's permissions (D46). The append
            was allowed by the rights now; the hub renews the token.
    HubPermissionsVersion:
      type: object
      description: The permission versions (D46) of the token's drive and of every drive.
      required:
      - drive
      - global
      properties:
        drive:
          type: integer
          minimum: 0
        global:
          type: integer
          minimum: 0
    HubRenewed:
      type: object
      description: A renewed room token, scoped by the rights now.
      required:
      - token
      - room
      - generation
      - scope
      - mode
      - exp
      - jti
      - permissions_version
      properties:
        token:
          type: string
        room:
          type: string
        generation:
          type: integer
        scope:
          type: string
          enum:
          - read
          - write
        mode:
          type: string
          enum:
          - ro
          - rw
        exp:
          type: integer
          description: Unix seconds, hub.token_ttl from the renewal.
        jti:
          type: string
        permissions_version:
          $ref: '#/components/schemas/HubPermissionsVersion'
