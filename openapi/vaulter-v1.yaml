    delete:
      operationId: comments.destroy
      tags:
      - comments
      summary: Delete a comment
      parameters:
      - $ref: '#/components/parameters/Node'
      - $ref: '#/components/parameters/Comment'
      responses:
        '204':
          description: No content
          headers:
            X-Vaulter-Api-Version:
              $ref: '#/components/headers/XVaulterApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlStore'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '500':
          $ref: '#/components/responses/Problem500'
  /collaboration/hub/authenticate:
    post:
      operationId: collaboration.hub.authenticate
      tags:
      - hub
      summary: 'Hub: authenticate a room connection'
      security:
      - hubSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - room
              properties:
                room:
                  type: string
      responses:
        '200':
          description: OK
          headers:
            X-Vaulter-Api-Version:
              $ref: '#/components/headers/XVaulterApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlStore'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HubAuthenticated'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '409':
          $ref: '#/components/responses/Problem409'
        '429':
          $ref: '#/components/responses/Problem429'
        '500':
          $ref: '#/components/responses/Problem500'
  /collaboration/hub/load:
    post:
      operationId: collaboration.hub.load
      tags:
      - hub
      summary: 'Hub: load the state of a room'
      security:
      - hubSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - room
              properties:
                room:
                  type: string
      responses:
        '200':
          description: OK
          headers:
            X-Vaulter-Api-Version:
              $ref: '#/components/headers/XVaulterApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlStore'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HubLoaded'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '409':
          $ref: '#/components/responses/Problem409'
        '429':
          $ref: '#/components/responses/Problem429'
        '500':
          $ref: '#/components/responses/Problem500'
  /collaboration/hub/store:
    post:
      operationId: collaboration.hub.store
      tags:
      - hub
      summary: 'Hub: store the state of a room'
      security:
      - hubSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - room
              - state
              properties:
                room:
                  type: string
                state:
                  type: string
                  description: Base64 Yjs state.
                content:
                  type:
                  - object
                  - 'null'
                seed:
                  type: boolean
                state_version:
                  type:
                  - integer
                  - 'null'
                  minimum: 0
      responses:
        '200':
          description: OK
          headers:
            X-Vaulter-Api-Version:
              $ref: '#/components/headers/XVaulterApiVersion'
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControlStore'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HubStoredEnvelope'
        '401':
          $ref: '#/components/responses/Problem401'
        '403':
          $ref: '#/components/responses/Problem403'
        '404':
          $ref: '#/components/responses/Problem404'
        '409':
          $ref: '#/components/responses/Problem409'
        '413':
          $ref: '#/components/responses/Problem413'
        '422':
          $ref: '#/components/responses/Problem422'
        '429':
          $ref: '#/components/responses/Problem429'
        '500':
          $ref: '#/components/responses/Problem500'
components:
  securitySchemes:
    hostAuth:
      type: http
      scheme: bearer
      description: Whatever the host application authenticates with (session, Sanctum, ...); Vaulter only needs an authenticated
        actor.
    hubSecret:
      type: apiKey
      in: header
      name: X-Vaulter-Collab-Secret
      description: Shared secret of the collaboration hub.
  parameters:
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: 'The ETag of the representation you read. Missing: 428 precondition_required. `*`: 428. Weak or stale tag:
        412. Checked after authorization.'
      schema:
        type: string
    IfMatchWhenReplacing:
      name: If-Match
      in: header
      required: false
      description: 'Required when the request replaces an existing node (node_id given): 428 without it, 412 on a stale tag.'
      schema:
        type: string
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: Weak comparison; a match answers 304 without a body, after authorization.
      schema:
        type: string
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque cursor from meta.next_cursor.
      schema:
        type: string
        maxLength: 2048
    PerPage:
      name: per_page
      in: query
      required: false
      description: Page size, 1..200, default 50.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    Drive:
      name: drive
      in: path
      required: true
      description: Drive id.
      schema:
        type: string
    Node:
      name: node
      in: path
      required: true
      description: Node id.
      schema:
        type: string
    Revision:
      name: revision
      in: path
      required: true
      description: Revision id.
      schema:
        type: string
    Grant:
      name: grant
      in: path
      required: true
      description: Grant id.
      schema:
        type: string
    Share:
      name: share
      in: path
      required: true
      description: Share link id.
      schema:
        type: string
    Comment:
      name: comment
      in: path
      required: true
      description: Comment id.
      schema:
        type: string
    ShareToken:
      name: token
      in: path
      required: true
      description: Share token.
      schema:
        type: string
    Upload:
      name: upload
      in: path
      required: true
      description: Upload session id.
      schema:
        type: string
    Endpoint:
      name: endpoint
      in: path
      required: true
      description: Webhook endpoint id.
      schema:
        type: string
    Delivery:
      name: delivery
      in: path
      required: true
      description: Webhook delivery id.
      schema:
        type: string
    ExportFormat:
      name: format
      in: path
      required: true
      description: Export format, for example html, md.
      schema:
        type: string
    ShareSession:
      name: X-Share-Session
      in: header
      required: false
      description: Session token returned by a previous share response.
      schema:
        type: string
    SharePassword:
      name: X-Share-Password
      in: header
      required: false
      description: Password of a protected share.
      schema:
        type: string
    TusResumableHeader:
      name: Tus-Resumable
      in: header
      required: false
      description: tus protocol version, 1.0.0.
      schema:
        type: string
  headers:
    ETag:
      description: 'Strong validator of the representation. Opaque: never parse it. Send it back verbatim in If-Match.'
      schema:
        type: string
        pattern: ^"[^"]+"$
    XVaulterApiVersion:
      description: Major version of the REST API that answered.
      required: true
      schema:
        type: string
        const: '1'
    XRequestId:
      description: 'Correlation id: the caller''s X-Request-Id when well formed, else a fresh ULID.'
      required: true
      schema:
        type: string
        pattern: ^[A-Za-z0-9._:-]{1,64}$
    CacheControlRevalidate:
      description: 'A single resource with an ETag: stored by the client, revalidated every time.'
      required: true
      schema:
        type: string
        const: no-cache, private
    CacheControlStore:
      description: Lists, mutations, sessions, secrets, downloads and errors are never stored.
      required: true
      schema:
        type: string
        const: no-store, private
    CacheControlAny:
      description: no-cache, private when the response carries an ETag, no-store otherwise.
      required: true
      schema:
        type: string
        enum:
        - no-cache, private
        - no-store, private
    CacheControlError:
      description: Errors are never stored.
      required: true
      schema:
        type: string
        enum:
        - no-store
        - no-store, private
    Location:
      description: Absolute URL of the redirect target.
      required: true
      schema:
        type: string
    UploadLocation:
      description: 'tus only: absolute URL of the upload session.'
      schema:
        type: string
    ReferrerPolicy:
      description: no-referrer on public share responses.
      schema:
        type: string
        const: no-referrer
    ReferrerPolicyRequired:
      description: no-referrer on every public share response.
      required: true
      schema:
        type: string
        const: no-referrer
    VaryRepresentation:
      description: The representation depends on who asks.
      required: true
      schema:
        type: string
        const: Authorization, Cookie
    VaryOptional:
      description: Present when the response carries an ETag.
      schema:
        type: string
        const: Authorization, Cookie
    XShareSession:
      description: Share session token; send it back as X-Share-Session on follow-up requests.
      schema:
        type: string
    RetryAfter:
      description: Seconds until the rate limit window resets.
      schema:
        type: integer
    XRateLimitLimit:
      description: Requests allowed per window.
      schema:
        type: integer
    XRateLimitRemaining:
      description: Requests left in the window.
      schema:
        type: integer
    ContentDisposition:
      description: attachment or inline, with a filename.
      required: true
      schema:
        type: string
        pattern: ^(attachment|inline);
    ContentSecurityPolicy:
      description: Sandboxes every served byte.
      required: true
      schema:
        type: string
        const: sandbox; default-src 'none'
    XContentTypeOptions:
      description: Always nosniff.
      required: true
      schema:
        type: string
        const: nosniff
    AcceptRangesNone:
      description: Range requests are not supported in 1.0.
      required: true
      schema:
        type: string
        const: none
    ContentLength:
      description: Size of the body in bytes.
      schema:
        type: integer
    XExportLossy:
      description: 1 when the chosen format drops information of the document.
      schema:
        type: string
    TusResumable:
      description: tus protocol version.
      schema:
        type: string
        const: 1.0.0
    UploadOffset:
      description: Bytes the server holds.
      schema:
        type: integer
    UploadLength:
      description: Declared total size.
      schema:
        type: integer
    TusVersion:
      description: Supported tus versions.
      schema:
        type: string
    TusExtension:
      description: Supported tus extensions.
      schema:
        type: string
    TusMaxSize:
      description: Largest accepted upload.
      schema:
        type: integer
    ETagRequired:
      description: 'Strong validator of the representation. Opaque: never parse it. Send it back verbatim in If-Match.'
      schema:
        type: string
        pattern: ^"[^"]+"$
      required: true
  responses:
    Problem400:
      description: Malformed request (invalid_cursor, ...).
      headers:
        X-Vaulter-Api-Version:
          $ref: '#/components/headers/XVaulterApiVersion'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControlError'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem401:
      description: No authenticated actor (actor_required) or a share password is required.
      headers:
        X-Vaulter-Api-Version:
          $ref: '#/components/headers/XVaulterApiVersion'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControlError'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem403:
      description: The caller may see the resource but lacks the ability (permission_denied, profile_restriction).
      headers:
        X-Vaulter-Api-Version:
          $ref: '#/components/headers/XVaulterApiVersion'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControlError'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem404:
      description: The resource does not exist or is not visible to the caller (same answer for both).
      headers:
        X-Vaulter-Api-Version:
          $ref: '#/components/headers/XVaulterApiVersion'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControlError'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem405:
      description: Method not allowed.
      headers:
        X-Vaulter-Api-Version:
          $ref: '#/components/headers/XVaulterApiVersion'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControlError'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem409:
      description: Conflict with the current state (node_name_conflict, invalid_destination, drive_archived, ...).
      headers:
        X-Vaulter-Api-Version:
          $ref: '#/components/headers/XVaulterApiVersion'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControlError'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem410:
      description: The cursor expired (cursor_expired).
      headers:
        X-Vaulter-Api-Version:
          $ref: '#/components/headers/XVaulterApiVersion'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControlError'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem412:
      description: 'Precondition failed: the If-Match tag does not match the current representation.'
      headers:
        X-Vaulter-Api-Version:
          $ref: '#/components/headers/XVaulterApiVersion'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControlError'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem413:
      description: Payload too large or quota exceeded.
      headers:
        X-Vaulter-Api-Version:
          $ref: '#/components/headers/XVaulterApiVersion'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControlError'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem415:
      description: Unsupported media type.
      headers:
        X-Vaulter-Api-Version:
          $ref: '#/components/headers/XVaulterApiVersion'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControlError'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem422:
      description: Validation failed (validation_failed and field-bound codes).
      headers:
        X-Vaulter-Api-Version:
          $ref: '#/components/headers/XVaulterApiVersion'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControlError'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem423:
      description: Content is unavailable, for example quarantined by the scanner (content_unavailable).
      headers:
        X-Vaulter-Api-Version:
          $ref: '#/components/headers/XVaulterApiVersion'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControlError'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem428:
      description: The operation requires If-Match (precondition_required).
      headers:
        X-Vaulter-Api-Version:
          $ref: '#/components/headers/XVaulterApiVersion'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControlError'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem429:
      description: Rate limited (rate_limited).
      headers:
        X-Vaulter-Api-Version:
          $ref: '#/components/headers/XVaulterApiVersion'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControlError'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem500:
      description: Unexpected failure (internal_error).
      headers:
        X-Vaulter-Api-Version:
          $ref: '#/components/headers/XVaulterApiVersion'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Cache-Control:
          $ref: '#/components/headers/CacheControlError'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Problem:
      type: object
      description: RFC 9457 problem details, served as application/problem+json.
      required:
      - type
      - title
      - status
      - code
      - request_id
      properties:
        type:
          type: string
          description: URI of the error code reference (docs/reference/errors.md#<code>).
        title:
          type: string
          description: Localized, human readable summary (Content-Language).
        status:
          type: integer
          description: HTTP status, repeated from the response line.
        code:
          type: string
          description: Stable machine readable code (SemVer). A status without a Vaulter code answers http_<status>.
          examples:
          - actor_required
          - cannot_delete_head_revision
          - collaboration_epoch_mismatch
          - collaboration_seed_conflict
          - collaboration_unavailable
          - comment_not_found
          - concurrent_update
          - content_unavailable
          - cross_drive_operation
          - cursor_expired
          - document_content_degraded
          - document_revision_not_found
          - document_state_mismatch
          - document_state_too_large
          - document_type_unavailable
          - drive_archived
          - drive_not_found
          - duplicate_registration
          - file_size_limit_exceeded
          - folder_children_limit_exceeded
          - grant_not_found
          - internal_error
          - invalid_cursor
          - invalid_destination
          - invalid_document_content
          - invalid_drive_state
          - invalid_node_name
          - invalid_properties
          - invalid_webhook_signature
          - method_not_allowed
          - node_move_cycle
          - node_name_conflict
          - node_not_found
          - node_not_trashed
          - node_sequence_exhausted
          - node_sequence_mismatch
          - node_trashed_by_ancestor
          - not_a_document
          - not_a_file
          - payload_too_large
          - permission_denied
          - precondition_required
          - profile_restriction
          - quota_exceeded
          - rate_limited
          - registry_frozen
          - restore_destination_changed
          - restore_destination_required
          - revision_not_found
          - revision_pinned
          - route_not_found
          - share_link_ttl_exceeded
          - share_not_found
          - share_password_required
          - share_role_not_allowed
          - tree_depth_limit_exceeded
          - tree_traversal_incomplete
          - unknown_document_type
          - unknown_export_format
          - unknown_profile
          - unknown_role
          - unsupported_node_kind
          - upload_conflict
          - upload_not_found
          - upload_offset_mismatch
          - upload_rejected
          - validation_failed
          - webhook_delivery_not_found
          - webhook_delivery_not_redeliverable
          - webhook_endpoint_not_found
          - write_outside_operation
        detail:
          type:
          - string
          - 'null'
          description: Localized explanation; never storage paths, tokens or SQL.
        request_id:
          type: string
          description: Equals the X-Request-Id response header.
        errors:
          type:
          - object
          - 'null'
          description: Laravel field map for validation_failed and field-bound errors.
        meta:
          type: object
          description: Allow-listed machine readable extras (reason, header, node_id, ...).
      additionalProperties: true
    PageMeta:
      type: object
      required:
      - next_cursor
      - per_page
      properties:
        next_cursor:
          type:
          - string
          - 'null'
          description: Opaque; pass it back as ?cursor to read the next page.
        per_page:
          type: integer
          minimum: 1
    Abilities:
      type: object
      description: What the caller may do with the node; twelve booleans.
      required:
      - view
      - download
      - comment
      - edit
      - create
      - move
      - copy
      - trash
      - restore
      - share
      - manage
      - delete
      properties:
        view:
          type: boolean
        download:
          type: boolean
        comment:
          type: boolean
        edit:
          type: boolean
        create:
          type: boolean
        move:
          type: boolean
        copy:
          type: boolean
        trash:
          type: boolean
        restore:
          type: boolean
        share:
          type: boolean
        manage:
          type: boolean
        delete:
          type: boolean
    NodeFile:
      type: object
      required:
      - revision_id
      - revision_number
      - size_bytes
      - sha256
      - mime
      - scan_status
      properties:
        revision_id:
          type: string
        revision_number:
          type: integer
        size_bytes:
          type: integer
        sha256:
          type: string
        mime:
          type:
          - string
          - 'null'
        scan_status:
          $ref: '#/components/schemas/ScanStatus'
    ScanStatus:
      type: string
      enum:
      - not_required
      - pending
      - clean
      - infected
      - failed
    NodeDocument:
      type: object
      required:
      - type
      - schema_version
      - state_version
      - collab_epoch
      - revision_id
      properties:
        type:
          type: string
        schema_version:
          type: integer
        state_version:
          type: integer
        collab_epoch:
          type: integer
        revision_id:
          type:
          - string
          - 'null'
    NodePresentation:
      type: object
      required:
      - handler
      - document_type
      - type_available
      - viewer
      - capabilities
      properties:
        handler:
          type:
          - string
          - 'null'
          description: Presentation handler id; null for documents.
        document_type:
          type:
          - string
          - 'null'
        type_available:
          type: boolean
        viewer:
          type: object
          required:
          - key
          - props
          properties:
            key:
