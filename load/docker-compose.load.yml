# VLT-LOAD P2.2 — load-test stand. Bring up: `TIER=S0 ./load/scripts/up.sh` (README.md).
#
# Resource converts are `cpuset`/`mem_limit`/`memswap_limit` ONLY (reference-env.md E-1/E-5):
# NEVER `cpus:`/`cpu_quota` (CFS-quota parks the process mid-period => sawtooth latency,
# unreproducible percentiles) and NEVER `deploy.resources.limits` (Swarm-only — a silently
# inert limit is a convert that doesn't exist). Empty CPUSET_* (S0/M — reference-env.md §4.1,
# D25) resolves to no `cpuset:` key at all (verified: `docker compose config` with an empty
# env var drops the field, does not emit `cpuset: ""`).
name: vaulter-load

# Container logs are capped: docker's default json-file driver keeps them without limit (3 × 10 MiB per container).
x-bounded-logs: &bounded-logs
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  postgres:
    logging: *bounded-logs
    build:
      context: .
      dockerfile: docker/Dockerfile.postgres-profile
    image: vaulter-load-postgres-profile:16-hypopg-1.4.1
    environment:
      POSTGRES_USER: vaulter
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: vaulter_load
      # E-3: shared_buffers/work_mem etc. are derived from the CONTAINER's cgroup limit
      # (this tier's .env), never from host RAM — postgres:16-alpine has no auto-tuning,
      # so every knob below is passed explicitly via `command`.
    cpuset: "${CPUSET_PG}"
    mem_limit: "${MEM_PG}"
    memswap_limit: "${MEMSWAP_PG}"
    command:
      - postgres
      - -c
      - shared_buffers=${PG_SHARED_BUFFERS}
      - -c
      - effective_cache_size=${PG_EFFECTIVE_CACHE_SIZE}
      - -c
      - work_mem=${PG_WORK_MEM}
      - -c
      - maintenance_work_mem=${PG_MAINTENANCE_WORK_MEM}
      - -c
      - max_connections=${PG_MAX_CONNECTIONS}
      - -c
      - max_parallel_workers_per_gather=${PG_MAX_PARALLEL_WORKERS_PER_GATHER}
      - -c
      - random_page_cost=${PG_RANDOM_PAGE_COST}
      - -c
      - effective_io_concurrency=${PG_EFFECTIVE_IO_CONCURRENCY}
      - -c
      - checkpoint_timeout=${PG_CHECKPOINT_TIMEOUT}
      - -c
      - max_wal_size=${PG_MAX_WAL_SIZE}
      - -c
      - log_lock_waits=on
      - -c
      - deadlock_timeout=1s
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
      - -c
      - pg_stat_statements.max=10000
      # E-6: fsync/synchronous_commit/full_page_writes stay ON on every tier — see
      # reference-env.md E-6 (write-hot v_activity/outbox measured with them off is not
      # the write path that ships).
      - -c
      - fsync=on
      - -c
      - synchronous_commit=on
      - -c
      - full_page_writes=on
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vaulter -d vaulter_load"]
      interval: 3s
      timeout: 3s
      retries: 30

  pgbouncer:
    logging: *bounded-logs
    image: edoburu/pgbouncer:latest
    environment:
      # edoburu/pgbouncer reads DATABASE_URL (parsed into DB_HOST/DB_PORT/DB_USER/
      # DB_PASSWORD/DB_NAME by its own entrypoint) — NOT DATABASE_HOST/DATABASE_* (those
      # are silently ignored, which fails startup with a cryptic "DB_HOST unset").
      DATABASE_URL: postgres://vaulter:secret@postgres:5432/vaulter_load
      LISTEN_PORT: "6432"
      POOL_MODE: transaction
      DEFAULT_POOL_SIZE: "${PGBOUNCER_DEFAULT_POOL_SIZE}"
      MAX_CLIENT_CONN: "${PGBOUNCER_MAX_CLIENT_CONN}"
      RESERVE_POOL_SIZE: "${PGBOUNCER_RESERVE_POOL_SIZE}"
      RESERVE_POOL_TIMEOUT: "${PGBOUNCER_RESERVE_POOL_TIMEOUT}"
      AUTH_TYPE: plain
      ADMIN_USERS: vaulter
    cpuset: "${CPUSET_PGBOUNCER}"
    mem_limit: "${MEM_PGBOUNCER}"
    memswap_limit: "${MEMSWAP_PGBOUNCER}"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 6432 -U vaulter -d vaulter_load"]
      interval: 3s
      timeout: 3s
      retries: 30

  minio:
    logging: *bounded-logs
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: vaulter
      MINIO_ROOT_PASSWORD: vaulter-load-secret
    cpuset: "${CPUSET_MINIO}"
    mem_limit: "${MEM_MINIO}"
    memswap_limit: "${MEMSWAP_MINIO}"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 3s
      timeout: 3s
      retries: 30

  minio-init:
    logging: *bounded-logs
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
      mc alias set load http://minio:9000 vaulter vaulter-load-secret &&
      mc mb --ignore-existing load/vaulter-load &&
      printf ok | mc pipe load/vaulter-load/.vaulter-health-sentinel
      "
    restart: "no"

  app:
    logging: *bounded-logs
    build:
      context: ..
      dockerfile: load/docker/Dockerfile.app
    working_dir: /app
    volumes:
      - ..:/app
      - ./app/testbench.load.yaml:/app/testbench.yaml:ro
    environment:
      TIER: "${TIER}"
      LOAD_RUN_ID: "${LOAD_RUN_ID:-}"
      LOAD_DB_TRACE: "${LOAD_DB_TRACE:-false}"
      LOAD_DB_TRACE_PATH: "${LOAD_DB_TRACE_PATH:-}"
      LOAD_CELL_ID: "${LOAD_CELL_ID:-}"
      LOAD_ATTEMPT: "${LOAD_ATTEMPT:-}"
      LOAD_QUEUE_LEDGER: "${LOAD_QUEUE_LEDGER:-}"
      LOAD_QUEUE_FINGERPRINT: "${LOAD_QUEUE_FINGERPRINT:-}"
      LOAD_SINK_HOSTS: "webhook-sink,127.0.0.1,localhost"
      LOAD_SINK_PORT: "8090"
      VAULTER_LOAD_METRICS_ENABLED: "${VAULTER_LOAD_METRICS_ENABLED:-true}"
      PM_MAX_CHILDREN: "${PM_MAX_CHILDREN}"
      DB_CONNECTION: pgsql
      DB_HOST: pgbouncer
      DB_PORT: "6432"
      DB_DATABASE: vaulter_load
      DB_USERNAME: vaulter
      DB_PASSWORD: secret
      # Migrations run direct-to-postgres (bypass the transaction-mode pool — see
      # load/docker/entrypoint.sh for why).
      DB_MIGRATE_HOST: postgres
      DB_MIGRATE_PORT: "5432"
      LOAD_SKIP_MIGRATIONS: "${LOAD_SKIP_MIGRATIONS:-0}"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: vaulter
      MINIO_ROOT_PASSWORD: vaulter-load-secret
      MINIO_BUCKET: vaulter-load
      MINIO_REGION: us-east-1
      VAULTER_LOAD_ID_STRATEGY: bigint
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_CLIENT: phpredis
      VAULTER_COLLAB_JWT_KEYS: "${VAULTER_COLLAB_JWT_KEYS:-load-1:vlt-load-dev-collab-jwt-key-not-for-production}"
      VAULTER_COLLAB_JWT_ACTIVE_KID: "${VAULTER_COLLAB_JWT_ACTIVE_KID:-load-1}"
      VAULTER_COLLAB_WEBHOOK_SECRET: "${VAULTER_COLLAB_WEBHOOK_SECRET:-vlt-load-dev-collab-webhook-not-for-production}"
      TESTBENCH_WORKING_PATH: /app
      VAULTER_OBSERVABILITY_ENABLED: "true"
    cpuset: "${CPUSET_APP}"
    mem_limit: "${MEM_APP}"
    memswap_limit: "${MEMSWAP_APP}"
    ports:
      # Override on hosts where 8080 is already taken by another stack, e.g.
      # `LOAD_APP_PORT=8180 TIER=S0 ./load/scripts/up.sh` — see README.md.
      - "${LOAD_APP_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      pgbouncer:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:8080/up >/dev/null 2>&1 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 60

  redis:
    logging: *bounded-logs
    image: redis:7-alpine
    command: ['redis-server', '--save', '', '--appendonly', 'no']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 3s
      timeout: 3s
      retries: 30

  queue-worker:
    logging: *bounded-logs
    build:
      context: ..
      dockerfile: load/docker/Dockerfile.app
    working_dir: /app
    volumes:
      - ..:/app
      - ./app/testbench.load.yaml:/app/testbench.yaml:ro
    environment:
      TIER: "${TIER}"
      LOAD_RUN_ID: "${LOAD_RUN_ID:-}"
      LOAD_DB_TRACE: "${LOAD_DB_TRACE:-false}"
      LOAD_DB_TRACE_PATH: "${LOAD_DB_TRACE_PATH:-}"
      LOAD_CELL_ID: "${LOAD_CELL_ID:-}"
      LOAD_ATTEMPT: "${LOAD_ATTEMPT:-}"
      LOAD_QUEUE_LEDGER: "${LOAD_QUEUE_LEDGER:-}"
      LOAD_QUEUE_FINGERPRINT: "${LOAD_QUEUE_FINGERPRINT:-}"
      LOAD_QUEUE_CONTEXT: "${LOAD_QUEUE_CONTEXT:-/app/load/seed/out/p6-queue-context.json}"
      LOAD_SINK_HOSTS: "webhook-sink,127.0.0.1,localhost"
      LOAD_SINK_PORT: "8090"
      VAULTER_LOAD_METRICS_ENABLED: "${VAULTER_LOAD_METRICS_ENABLED:-true}"
      PM_MAX_CHILDREN: "1"
      QUEUE_CONNECTION: redis
      CACHE_STORE: redis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_CLIENT: phpredis
      DB_CONNECTION: pgsql
      DB_HOST: pgbouncer
      DB_PORT: "6432"
      DB_DATABASE: vaulter_load
      DB_USERNAME: vaulter
      DB_PASSWORD: secret
      # Workers must never bootstrap/reset the shared application database.
      LOAD_SKIP_MIGRATIONS: "1"
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: vaulter
      MINIO_ROOT_PASSWORD: vaulter-load-secret
      MINIO_BUCKET: vaulter-load
      MINIO_REGION: us-east-1
      VAULTER_LOAD_ID_STRATEGY: bigint
      TESTBENCH_WORKING_PATH: /app
    command: ['php', 'vendor/bin/testbench', 'queue:work', 'redis', '--queue=load-health,default', '--sleep=1', '--tries=1']
    depends_on:
      redis:
        condition: service_healthy
      app:
        condition: service_healthy
      webhook-sink:
        condition: service_started

  webhook-sink:
    logging: *bounded-logs
    build:
      context: ..
      dockerfile: load/docker/Dockerfile.app
    working_dir: /app
    volumes:
      - ..:/app
    environment:
      LOAD_SINK_LEDGER: /app/load/seed/out/sink-ledger.jsonl
      LOAD_SINK_HANG_SECONDS: "8"
      LOAD_SINK_DELAY_MS: "50"
      LOAD_SINK_PORT: "8090"
    entrypoint: ["php", "-S", "0.0.0.0:8090", "-t", "/app/load/webhook-sink", "/app/load/webhook-sink/router.php"]
    expose:
      - "8090"

  hocuspocus:
    logging: *bounded-logs
    build:
      context: ../packages/collaboration/hub
      dockerfile: Dockerfile
    environment:
      NODE_ENV: production
      VAULTER_COLLAB_PORT: '1234'
      # The app container reads /stats of the management listener (CollaborationRoomMetrics), so it
      # binds every interface of this stand's private network.
      VAULTER_COLLAB_MANAGEMENT_HOST: 0.0.0.0
      VAULTER_COLLAB_MANAGEMENT_PORT: '1235'
      VAULTER_BACKEND_URL: http://app:8080
      VAULTER_API_PREFIX: api/vaulter
      VAULTER_COLLAB_WEBHOOK_SECRET: ${VAULTER_COLLAB_WEBHOOK_SECRET:-vlt-load-dev-collab-webhook-not-for-production}
      VAULTER_COLLAB_ALLOWED_ORIGINS: '*'
    ports:
      - '127.0.0.1:1235:1235'
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:1235/livez').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20

  prometheus:
    logging: *bounded-logs
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
    volumes:
      - ./docker/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom-data:/prometheus
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://127.0.0.1:9090/-/ready >/dev/null 2>&1 || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Generator. Not started by `up.sh` (no k6 scripts exist yet — those are P2.4); defined
  # here so the resource convert and depends_on chain (postgres -> app -> k6,
  # Implementation Rules P2.2) are already correct for P2.4-P2.8 to run
  # `docker compose -f load/docker-compose.load.yml run --rm k6 <script>` against.
  k6:
    logging: *bounded-logs
    image: grafana/k6:0.55.0
    cpuset: "${CPUSET_K6}"
    mem_limit: "${MEM_K6}"
    memswap_limit: "${MEMSWAP_K6}"
    environment:
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
    volumes:
      - ./k6:/scripts:ro
      # P2.5 — `handleSummary` (load/k6/lib/summary.js) needs somewhere writable to put
      # summary.json; /scripts is deliberately :ro (scenario code is not a run artifact).
      - ./results:/results
    depends_on:
      app:
        condition: service_healthy
    profiles:
      - bench

volumes:
  pg-data:
  minio-data:
  prom-data:
