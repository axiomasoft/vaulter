# Memory lane overlay (use WITH docker-compose.load.yml).
# Fresh `app` per case is enforced by p4-memory.sh (compose run --rm), not by this file alone.
name: vaulter-load

services:
  app:
    environment:
      PM_MAX_CHILDREN: "1"
    volumes:
      - ./docker/php-fpm.memory.conf:/usr/local/etc/php-fpm.d/www.conf.template:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O- 'http://127.0.0.1:8081/fpm-status?json&full' >/dev/null 2>&1 || exit 1",
        ]
      interval: 3s
      timeout: 3s
      retries: 60
