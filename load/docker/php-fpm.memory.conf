; VLT-LOAD P4.1 — isolated memory lane FPM pools (TEMPLATE — envsubst on PM_MAX_CHILDREN).
; Bench traffic uses [memory] on :9000 with pm.max_children=1. Health/status uses [memory_status]
; on :9001 so docker healthcheck and /fpm-status never occupy the measured worker.
[memory]
user = root
group = root
listen = 127.0.0.1:9000
pm = static
pm.max_children = ${PM_MAX_CHILDREN}

chdir = /app
env[TESTBENCH_WORKING_PATH] = /app
clear_env = no
catch_workers_output = yes
decorate_workers_output = no

[memory_status]
user = root
group = root
listen = 127.0.0.1:9001
pm = static
pm.max_children = 1
pm.status_path = /fpm-status

chdir = /app
env[TESTBENCH_WORKING_PATH] = /app
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
