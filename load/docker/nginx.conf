# VLT-LOAD P2.2 — SUT front. nginx does NOT buffer request bodies to a size limit
# (client_max_body_size 0): the size cap that matters is vaulter's OWN
# uploads.max_chunk_bytes (config, enforced in S3MultipartHandler/TusUploadHandler) —
# capping earlier at nginx would clip a chunk before the package's own limit is
# exercised, and the harness exists to measure the PACKAGE, not nginx (D-LOAD-4).
user root;
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 2048;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    sendfile on;
    client_max_body_size 0;
    fastcgi_buffers 16 16k;
    fastcgi_buffer_size 32k;

    server {
        listen 8080;
        root /app/vendor/orchestra/testbench-core/laravel/public;
        index index.php;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param REQUEST_URI $request_uri;
            fastcgi_read_timeout 300;
            fastcgi_request_buffering off;
        }
    }

    server {
        listen 127.0.0.1:8081;

        location = /fpm-status {
            include /etc/nginx/fastcgi_params;
            fastcgi_pass 127.0.0.1:9001;
            fastcgi_param SCRIPT_FILENAME "";
            fastcgi_param SCRIPT_NAME /fpm-status;
            fastcgi_param REQUEST_URI /fpm-status;
            fastcgi_param QUERY_STRING $args;
            fastcgi_pass_request_body off;
            fastcgi_param CONTENT_LENGTH "";
        }
    }
}
