; VLT-LOAD P2.2 — PHP-FPM worker settings.
;
; memory_limit is the one-worker RAM ceiling that reference-env.md §1.6 uses to derive
; "pm.max_children workers never all fit in mem_limit at once" — the mechanism L-01 rides
; on (D7/D-LOAD-5a). Do NOT raise it "to make complete() pass" — that would hide the
; finding the harness exists to demonstrate (Code Guidance, phases/P2.md P2.4).
memory_limit = 512M

; Unlimited at the PHP layer: vaulter's OWN uploads.max_chunk_bytes (config, enforced in
; S3MultipartHandler/TusUploadHandler) is the cap under test. A tighter php.ini ceiling
; would clip a chunk before the package's own limit is exercised (D-LOAD-4 — measure the
; package, not php.ini).
upload_max_filesize = 0
post_max_size = 0

max_execution_time = 300
max_input_time = 300

opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
