; VLT-LOAD P2.2 — FPM pool, the raccounting that pm.max_children/slo.md §0.1 stands on.
; ${PM_MAX_CHILDREN} is substituted at container start (entrypoint.sh, envsubst) from the
; tier .env (load/env/{S0,S,M}.env) — this file is a TEMPLATE, not the live pool config.
[www]
user = root
group = root
listen = 127.0.0.1:9000
pm.status_path = /fpm-status
pm.status_listen = 127.0.0.1:9001

pm = static
pm.max_children = ${PM_MAX_CHILDREN}

; The app dir is bind-mounted to /app (docker-compose.load.yml); chdir here matches the
; `vendor/bin/testbench` CLI's own default (getcwd()) so package_path() resolution is
; identical for both request-serving (this pool) and the CLI migrate step (entrypoint.sh).
chdir = /app

; testbench's bootstrap/autoload.php defines the TESTBENCH_WORKING_PATH constant from
; getenv() when it isn't already `defined()` (vendor/orchestra/testbench-core/laravel/
; bootstrap/autoload.php:3-5) — this is how a plain `public/index.php` request (nginx+fpm,
; NOT `testbench serve`) finds our testbench.load.yaml at /app/testbench.yaml instead of
; the vendor skeleton's own (nonexistent) bootstrap/cache/testbench.yaml.
env[TESTBENCH_WORKING_PATH] = /app

; clear_env=no passes the container's own environment (DB_*, MINIO_*, VAULTER_*, set by
; docker-compose.load.yml `environment:`) straight through to getenv()/env() calls in
; LoadServiceProvider — mirrors how `testbench serve` curates its child process env
; (harness.md §2.2), just via the FPM pool instead of a passthrough-variables list.
clear_env = no

catch_workers_output = yes
decorate_workers_output = no
