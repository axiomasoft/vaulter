services:
  docvault-collab:
    build: .
    image: docvault/hocuspocus-server:dev
    ports:
      - "${DOCVAULT_COLLAB_PORT:-1234}:1234"
    environment:
      DOCVAULT_COLLAB_PORT: 1234
      DOCVAULT_COLLAB_APP_ID: ${DOCVAULT_COLLAB_APP_ID:-}
      DOCVAULT_COLLAB_SECRET: ${DOCVAULT_COLLAB_SECRET:-}
      DOCVAULT_BACKEND_URL: ${DOCVAULT_BACKEND_URL:-http://host.docker.internal}
    restart: unless-stopped
