# Vaulter collaboration hub — reference deployment.
#
# The recommended model is to REFERENCE the published image (not vendor the sources):
#   image: ghcr.io/axioma-studio/vaulter-hocuspocus:<version>   # pin @sha256:… in prod
# and configure it entirely through environment variables. For LOCAL development against
# this repo, uncomment `build: .` to build the image from source instead.
#
# Full env contract + security guidance (wss/TLS, Origin allowlist, scaling): see
# docs/guide/hocuspocus-server.md.
services:
  vaulter-collab:
    image: ghcr.io/axioma-studio/vaulter-hocuspocus:latest
    # build: .   # ← local dev: build from source instead of pulling the published image
    ports:
      # Bound to 127.0.0.1 by default: the WS port must NOT face the internet directly.
      # The per-IP Throttle keys on the X-Real-IP / X-Forwarded-For headers, which a directly
      # connected client can SPOOF to bypass the ban — so always front the hub with a TLS
      # reverse proxy that OVERWRITES those headers (see docs/guide/hocuspocus-server.md). To
      # expose it for a remote proxy on another host, change this to "${VAULTER_COLLAB_PORT:-1234}:1234".
      - "127.0.0.1:${VAULTER_COLLAB_PORT:-1234}:1234"
    environment:
      # — Connectivity —
      VAULTER_COLLAB_PORT: 1234
      VAULTER_COLLAB_HEALTH_PORT: 1235
      # The Laravel backend the hub calls back into (collab/authenticate + collab/store).
      VAULTER_BACKEND_URL: ${VAULTER_BACKEND_URL:-http://host.docker.internal}
      VAULTER_API_PREFIX: ${VAULTER_API_PREFIX:-api/vaulter}
      # Optional shared webhook secret; when unset the webhooks are authenticated by the
      # forwarded room JWT alone (never open). MUST equal the Laravel webhook_secret.
      VAULTER_COLLAB_WEBHOOK_SECRET: ${VAULTER_COLLAB_WEBHOOK_SECRET:-}

      # — Security (CSWSH / DoS) — REQUIRED in production —
      # Comma-separated EXACT browser origins allowed to connect ("*" = any, dev only).
      VAULTER_COLLAB_ALLOWED_ORIGINS: ${VAULTER_COLLAB_ALLOWED_ORIGINS:-}
      VAULTER_COLLAB_MAX_PAYLOAD_BYTES: ${VAULTER_COLLAB_MAX_PAYLOAD_BYTES:-4194304}
      VAULTER_COLLAB_THROTTLE: ${VAULTER_COLLAB_THROTTLE:-15}
      VAULTER_COLLAB_THROTTLE_SECONDS: ${VAULTER_COLLAB_THROTTLE_SECONDS:-60}
      VAULTER_COLLAB_BAN_TIME: ${VAULTER_COLLAB_BAN_TIME:-5}

      # — Liveness / persistence pressure —
      VAULTER_COLLAB_TIMEOUT_MS: ${VAULTER_COLLAB_TIMEOUT_MS:-30000}
      VAULTER_COLLAB_DEBOUNCE_MS: ${VAULTER_COLLAB_DEBOUNCE_MS:-5000}
      VAULTER_COLLAB_MAX_DEBOUNCE_MS: ${VAULTER_COLLAB_MAX_DEBOUNCE_MS:-30000}

      # — Scaling (multi-instance) — set a Redis URL + a unique instance name —
      VAULTER_COLLAB_REDIS_URL: ${VAULTER_COLLAB_REDIS_URL:-}
      VAULTER_COLLAB_INSTANCE_NAME: ${VAULTER_COLLAB_INSTANCE_NAME:-vaulter-hocuspocus}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:1235/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped
